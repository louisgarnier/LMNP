<style>
body > .header, body > .indicator-bar{display:none!important}body > .main{padding:0!important;max-width:none!important;margin:0!important}
body{margin:0!important;background:#f4f5f7!important;color:#172b4d!important;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important}.container{max-width:none!important;padding:0!important}body>header,body>footer{display:none!important}*{box-sizing:border-box}#gestion{font-size:14px;line-height:1.5}#gestion button,#gestion select,#gestion input{font:inherit}#gestion button,#gestion a{cursor:pointer}#gestion button{border:1px solid #dfe1e6;border-radius:6px;padding:8px 12px;background:white;color:#172b4d}#gestion button:hover{background:#edf3fd}#gestion button:focus-visible,#gestion a:focus-visible{outline:3px solid #73a5ef;outline-offset:2px}#gestion button:disabled{opacity:.45;cursor:not-allowed}#gestion button.primary{background:#0052cc;color:white;border-color:#0052cc}#gestion .studio{background:#e9eff9;padding:9px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:12px}#gestion .studio button{padding:4px 10px;font-size:12px}#gestion .shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 48px)}#gestion aside{background:#f9fafc;border-right:1px solid #dfe1e6;padding:24px 14px;display:flex;flex-direction:column;gap:5px}#gestion .brand{font-size:22px;font-weight:750;letter-spacing:-1px;padding:0 12px 24px}#gestion .brand span{color:#0052cc}#gestion .section-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#6b778c;margin:20px 12px 8px;font-weight:700}#gestion aside button{border:0;background:transparent;text-align:left;padding:11px 12px}#gestion aside button.active{color:#0052cc;background:#e7effc;font-weight:650}#gestion .account{margin-top:auto;padding:24px 12px 0;font-size:12px;color:#5e6c84}#gestion .workspace{min-width:0}#gestion .topbar{height:66px;background:white;border-bottom:1px solid #dfe1e6;display:flex;justify-content:space-between;align-items:center;padding:0 30px;gap:12px}#gestion .context{display:flex;gap:12px;align-items:center}#gestion select,#gestion input{border:1px solid #dfe1e6;background:white;border-radius:5px;padding:8px 10px;color:#172b4d}#gestion main{max-width:1400px;margin:auto;padding:28px 30px 60px}#gestion h1{font-size:27px;letter-spacing:-.6px;margin:0 0 4px;font-weight:700}#gestion h2{font-size:17px;margin:0 0 14px}#gestion h3{font-size:14px;margin:0 0 8px}#gestion p{margin:5px 0 16px}#gestion .muted{color:#5e6c84}#gestion .head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}#gestion .badge{display:inline-block;background:#e8f1ff;color:#0052cc;border-radius:4px;font-size:10px;font-weight:700;padding:3px 7px;vertical-align:middle}#gestion .green{background:#e5f3ed;color:#17694e}#gestion .orange{background:#fff1d9;color:#895400}#gestion .grey{background:#edf0f5;color:#5e6c84}#gestion .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}#gestion .metric,#gestion .panel{background:white;border:1px solid #dfe1e6;border-radius:9px;padding:20px}#gestion .metric strong{display:block;font-size:26px;letter-spacing:-.6px;margin:6px 0}#gestion .metric small{color:#5e6c84}#gestion .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}#gestion .wide{grid-column:1/-1}#gestion .tabs{display:flex;gap:4px;border-bottom:1px solid #dfe1e6;margin:0 0 22px;overflow-x:auto}#gestion .tabs button{white-space:nowrap;border:0;border-radius:0;background:transparent;padding:12px 14px;border-bottom:2px solid transparent}#gestion .tabs button.active{color:#0052cc;border-bottom-color:#0052cc;font-weight:650}#gestion .table-wrap{overflow-x:auto;border:1px solid #dfe1e6;border-radius:8px;background:white}#gestion table{width:100%;border-collapse:collapse;font-size:13px}#gestion th{background:#f7f8fa;color:#5e6c84;text-align:left;font-size:11px;font-weight:600;padding:12px 14px;white-space:nowrap}#gestion td{border-top:1px solid #edf0f5;padding:14px}#gestion td.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}#gestion .toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}#gestion .toolbar .spacer{flex:1}#gestion .note{background:#f0f5fc;border-left:3px solid #0052cc;padding:13px 16px;border-radius:4px;margin:16px 0;font-size:13px}#gestion .property-card{display:grid;grid-template-columns:72px 1fr;gap:17px;align-items:start}#gestion .building{height:72px;background:#e8eef6;border-radius:9px;display:grid;place-items:center;color:#1e3a5f;font-size:32px}#gestion .card-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}#gestion dl{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0}#gestion dt{color:#5e6c84}#gestion dd{margin:0}#gestion .list-row{padding:13px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:15px}#gestion .list-row:last-child{border:0}#gestion .kanban{display:flex;gap:14px;overflow:auto;padding-bottom:18px}#gestion .column{flex:0 0 220px;background:#edf0f5;border-radius:8px;padding:12px;min-height:340px}#gestion .column h3{display:flex;justify-content:space-between;font-size:12px}#gestion .candidate{width:100%;background:white!important;display:block;text-align:left;padding:15px!important;margin-top:14px}#gestion .candidate strong{display:block;margin:9px 0 3px}#gestion .candidate small{display:block;color:#5e6c84;margin:8px 0}#gestion .column .empty{font-size:12px;color:#7a869a;margin-top:24px}#gestion .preserve td:first-child{font-weight:600;min-width:160px}#gestion .link{color:#0052cc;text-decoration:none}#gestion .statusline{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}#gestion .checklist label{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}#gestion .checklist input{accent-color:#0052cc}#gestion dialog{width:min(600px,92vw);max-height:90vh;overflow:auto;border:1px solid #dfe1e6;border-radius:12px;padding:28px;color:#172b4d;box-shadow:0 20px 90px #172b4d40}#gestion dialog::backdrop{background:#172b4d65}#gestion .dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}#gestion .form{display:grid;gap:14px}#gestion .form label{display:grid;gap:5px}#gestion .comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px}#gestion .fiscal-title{background:#1e3a5f;color:white;padding:16px;border-radius:6px 6px 0 0}#gestion .progressbar{height:5px;background:#e8edf4;border-radius:3px;overflow:hidden;margin:16px 0}#gestion .progressbar span{height:100%;background:#0052cc;display:block}#gestion .toast{position:fixed;bottom:22px;right:22px;max-width:400px;background:#172b4d;color:white;padding:15px 20px;border-radius:8px;z-index:20}#gestion .hidden{display:none}#gestion .rent td{padding:12px 9px;text-align:center;white-space:nowrap}#gestion .rent td:first-child{text-align:left;position:sticky;left:0;background:white}#gestion .rent button{padding:4px 6px;font-size:12px;border:0;background:#e5f3ed;color:#17694e}#gestion .rent button.late{background:#fff1d9;color:#895400}#gestion .reviewbar{font-size:12px;color:#5e6c84;margin-top:24px}#gestion .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:950px){#gestion .metrics{grid-template-columns:repeat(2,1fr)}#gestion .shell{grid-template-columns:180px minmax(0,1fr)}#gestion main{padding:22px 18px}#gestion .topbar{padding:0 18px}#gestion .grid{grid-template-columns:1fr}}@media(max-width:650px){#gestion .shell{display:block}#gestion aside{flex-direction:row;overflow:auto;padding:8px;position:relative}#gestion aside button{white-space:nowrap}#gestion .brand,#gestion .section-label,#gestion .account{display:none}#gestion .head{align-items:flex-start;flex-direction:column}#gestion .studio{align-items:flex-start}#gestion .comparison{grid-template-columns:1fr}#gestion .topbar{height:auto;padding:12px;flex-wrap:wrap}#gestion .fieldgrid{grid-template-columns:1fr}}
</style>
<div id="gestion">
<div class="studio"><span><strong>MAQUETTE 01 · révision 3</strong> · Navigation & parcours · Données fictives · Aucun envoi ni modification réelle</span><button onclick="go('preservation')">Existant → nouvelle application</button></div>
<div class="shell"><aside><div class="brand">lmnp<span>.</span> <small style="font-size:12px;letter-spacing:0">gestion</small></div><button data-nav="home" onclick="go('home')">▦ &nbsp; Vue d’ensemble</button><div class="section-label">Gestion locative</div><button data-nav="property" onclick="go('property')">⌂ &nbsp; Mes biens</button><button data-nav="candidates" onclick="go('candidates')">▤ &nbsp; Candidatures</button><button data-nav="rents" onclick="go('rents')">€ &nbsp; Loyers & charges</button><div class="section-label">Finance existante</div><button data-nav="transactions" onclick="go('transactions')">⇄ &nbsp; Transactions</button><button data-nav="fiscal" onclick="go('fiscal')">▥ &nbsp; Comptabilité & fiscalité</button><div class="section-label">Organisation</div><button data-nav="partners" onclick="go('partners')">♧ &nbsp; Prestataires</button><button data-nav="settings" onclick="go('settings')">⚙ &nbsp; Réglages</button><div class="account"><strong>Espace propriétaire</strong><br>proprietaire@exemple.fr<br><span class="badge grey">Accès partenaires · V2</span></div></aside>
<div class="workspace"><div class="topbar"><div class="context"><span class="muted" id="scope-label">Portefeuille</span><select aria-label="Bien sélectionné" id="property-select" onchange="changeProperty(this.value)"><option value="evry">Évry · Les Miroirs</option><option value="marseille">Marseille · Le Patio</option></select></div><span class="muted" id="scope-note">Gestion et finance du même bien</span></div><main id="screen"></main></div></div>
<dialog id="detail"><div id="dialog-content"></div></dialog><div id="toast" role="status" class="toast hidden"></div>
</div>
<script>
const model={page:'home',property:'evry',propertyTab:'Vue du bien',txTab:'Toutes les transactions',fiscalTab:'Position fiscale globale',fiscalSub:'Ma position',rentTab:'Suivi des loyers',assigned:false,created:false,advance:false};
const properties={evry:{name:'Évry · Les Miroirs',type:'Colocation · 5 chambres · 105 m²',mode:'Baux individuels',rent:'2 250 €',occupancy:'4 / 5 chambres'},marseille:{name:'Marseille · Le Patio',type:'Appartement · 3 pièces · 62 m²',mode:'Logement entier',rent:'980 €',occupancy:'Loué'}};
const P=()=>properties[model.property];
const btn=(label,action,primary=false)=>`<button class="${primary?'primary':''}" onclick="${action}">${label}</button>`;
const badge=(label,color='')=>`<span class="badge ${color}">${label}</span>`;
const table=(heads,rows,cls='')=>`<div class="table-wrap"><table class="${cls}"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const title=(name,desc,action='')=>`<div class="head"><div><h1>${name}</h1><p class="muted">${desc}</p></div>${action}</div>`;
const tabs=(items,key)=>`<div class="tabs">${items.map(x=>btn(x,`model.${key}='${x}';render()`).replace('class=""',`class="${model[key]===x?'active':''}"`)).join('')}</div>`;
const live=(path,label='Ouvrir l’écran actuel ↗')=>`<a class="link" target="_blank" rel="noopener" href="http://localhost:3000${path}">${label}</a>`;
function go(page){model.page=page;render();window.scrollTo({top:0});}
function changeProperty(value){model.property=value;render();}
function notice(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4200);}
function modal(heading,content){document.getElementById('dialog-content').innerHTML=`<div class="dialog-head"><h2>${heading}</h2>${btn('Fermer',"document.getElementById('detail').close()")}</div>${content}`;document.getElementById('detail').showModal();}
function home(){return title('Votre patrimoine, au même endroit','La gestion quotidienne de vos biens, avec votre comptabilité toujours à portée de main.')+`<div class="metrics"><div class="metric"><small>Biens</small><strong>2</strong><small>Votre portefeuille</small></div><div class="metric"><small>Loyers attendus · octobre</small><strong>2 780 €</strong><small>5 contrats en cours</small></div><div class="metric"><small>Reste à recevoir</small><strong>150 €</strong><small>1 paiement partiel</small></div><div class="metric"><small>À valider</small><strong>3 dossiers</strong><small>Votre décision est attendue</small></div></div><div class="head"><h2>Mes biens</h2>${btn('+ Ajouter un bien',"newProperty()")}</div><div class="grid">${Object.entries(properties).map(([k,p])=>`<section class="panel"><div class="property-card"><div class="building">⌂</div><div><h2>${p.name}</h2><p class="muted">${p.type}</p>${badge(p.mode,'grey')} ${badge(p.occupancy,k==='evry'?'orange':'green')}</div></div><div class="list-row"><span>Résultat net comptable</span><span class="muted">Carte existante conservée</span></div><div class="list-row"><span>Loyer à pleine occupation</span><strong>${p.rent} / mois</strong></div><div class="card-actions">${btn('Gérer le bien',`model.property='${k}';go('property')`,true)}${btn('Transactions',`model.property='${k}';go('transactions')`)}${btn('Comptabilité',`model.property='${k}';model.fiscalTab='États financiers';go('fiscal')`)}</div></section>`).join('')}<section class="panel"><h2>À faire aujourd’hui</h2><div class="list-row"><span>Dossier de Camille · pièces reçues</span>${btn('Examiner',"candidate()")}</div><div class="list-row"><span>Virement de 450 € · locataire à préciser</span>${btn('Rattacher',"assign()")}</div><div class="list-row"><span>Alex · 150 € restant à recevoir</span>${btn('Voir le solde',"go('rents')")}</div></section><section class="panel"><h2>Votre position fiscale</h2><p class="muted">Retrouvez la position globale, les résultats par appartement, le contrôle des liasses et les reports qui expirent.</p>${badge('Module existant conservé','green')}<div class="card-actions">${btn('Ouvrir la fiscalité globale',"model.fiscalTab='Position fiscale globale';go('fiscal')")}</div></section></div>`;}
const propertyTabs=['Vue du bien','Informations','Locataires','Contrats & garants','Documents','Annonces','Réglages du bien'];
function property(){let content='';switch(model.propertyTab){case 'Vue du bien':content=`<div class="grid"><section class="panel"><h2>Occupation</h2>${table(['Lot','Occupation','Loyer'],model.property==='evry'?[['Chambre 1','Léa Martin','450 €'],['Chambre 2','Alex Bernard','450 €'],['Chambre 3','Nora Petit','450 €'],['Chambre 4','Sam Robert','450 €'],['Chambre 5',badge('À louer','orange'),'450 €']]:[['Logement entier','Robin Moreau','980 €']])}<div class="card-actions">${btn('Suivre les loyers',"go('rents')",true)}${btn('Chercher un locataire',"go('candidates')")}</div></section><section class="panel"><h2>Gestion du bien</h2><dl><dt>Mode de location</dt><dd>${P().mode}</dd><dt>Banque</dt><dd>Compte du bien · Enable Banking</dd><dt>Régime fiscal</dt><dd>${regimeLabel(model.property)}</dd><dt>Fiscalité existante</dt><dd>${regimes[model.property]==='reel'?'Inclus dans les calculs LMNP au réel':'Exclu des calculs LMNP au réel'}</dd><dt>Documents</dt><dd>DPE · assurance PNO · syndic</dd></dl><div class="card-actions">${btn('Voir les informations',"model.propertyTab='Informations';render()")}</div><hr style="border:0;border-top:1px solid #edf0f5;margin:24px 0"><h2>Finance du même bien</h2><p class="muted">Un accès direct à vos outils actuels.</p><div class="card-actions">${btn('Transactions',"go('transactions')")}${btn('Bilan & résultat',"model.fiscalTab='États financiers';go('fiscal')")}</div></section></div>`;break;
case 'Informations':content=`<div class="grid">${[['Informations principales',[['Intitulé',P().name],['Type','Appartement'],['Surface',model.property==='evry'?'105 m²':'62 m²'],['Pièces / chambres',model.property==='evry'?'6 pièces · 5 chambres':'3 pièces']]],['Informations complémentaires',[['Chauffage','Collectif'],['Eau chaude','Collective'],['Chaudière individuelle','Non'],['Accès immeuble','Renseigné dans le dossier privé']]],['Diagnostics techniques',[['DPE / GES','D / B'],['Rapport DPE','diagnostic-exemple.pdf'],['Électricité / gaz','Documents à renseigner'],['Plomb, amiante, risques','Documents à renseigner']]],['Finances & assurances',[['Taxe foncière / CFE','Avis annuels et justificatifs'],['Acquisition / prêt','Informations et documents'],['PNO / emprunteur','Contrats et attestations'],['Rappels automatiques','Non prévus en V1']]],['Immeuble & syndic',[['Régime','Copropriété'],['Syndic','Coordonnées à compléter'],['Construction','Année à renseigner'],['Contacts','E-mail et téléphone']]]].map(([h,rows])=>`<section class="panel"><h2>${h}</h2><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><div class="card-actions">${btn('Modifier',`editInfo('${h}')`)}</div></section>`).join('')}</div>`;break;
case 'Locataires':content=table(['Locataire','Bail','État','Accès'],[['Léa Martin','Chambre 1',badge('En cours','green'),btn('Voir la fiche',"tenant()")],['Alex Bernard','Chambre 2',badge('150 € à recevoir','orange'),btn('Voir la fiche',"tenant()")],['Anciens locataires','Historique',badge('Conservé','grey'),btn('Voir les archives',"notice('Archives : contrats, documents et soldes conservés — aperçu de navigation.')")]]);break;
case 'Contrats & garants':content=`<section class="panel"><h2>Baux et garanties</h2>${table(['Contrat','Conditions','Garant',''],[['Léa · chambre 1','410 € + 40 € de charges','Visale',btn('Voir le contrat',"lease()")],['Alex · chambre 2','410 € + 40 € de charges','Personne physique',btn('Voir le contrat',"lease()")]])}<p class="reviewbar">Bail commun : plusieurs signataires, sans chambre attribuée. Les contrats passés restent consultables.</p></section>`;break;
case 'Documents':content=table(['Document','Rattachement','Type',''],[['DPE — exemple','Bien','Diagnostic',badge('Fichier démo','grey')],['Attestation PNO — exemple','Bien','Assurance',badge('Fichier démo','grey')],['Bail signé — exemple','Léa · chambre 1','Contrat',btn('Voir le parcours',"lease()")],['État des lieux — exemple','Léa · chambre 1','Entrée',btn('Intervention associée',"go('partners')")]])+`<div class="card-actions">${btn('Déposer un document',"notice('Maquette : dépôt manuel, choix du type et rattachement au bien ou au contrat.')")}</div>`;break;
case 'Annonces':content=`<div class="grid"><section class="panel"><h2>Chambre lumineuse en colocation · Évry</h2><p>Chambre meublée dans un appartement partagé, cuisine équipée et espaces communs. Disponible à partir du 15 novembre.</p><div class="statusline">${badge('450 € / mois','grey')}${badge('6 photos enregistrées','grey')}</div><div class="card-actions">${btn('Préparer l’annonce',"editInfo('Annonce et photos')",true)}${btn('Voir les candidatures',"go('candidates')")}</div></section><section class="panel"><h2>Diffusion</h2><div class="list-row">Leboncoin ${badge('Connexion à étudier','orange')}</div><div class="list-row">La Carte des Colocs ${badge('Connexion à étudier','orange')}</div><p class="muted">Conserver le contenu pour publier ou réactiver rapidement. Les actions disponibles dépendront des intégrations confirmées.</p></section></div>`;break;
default:content=`<section class="panel"><h2>Paramètres du bien</h2><div class="form"><label>Mode de location<select><option>${P().mode}</option><option>Colocation · bail commun</option><option>Location par chambre</option><option>Courte durée</option></select></label><p class="muted">Les changements conservent l’historique des contrats. Le choix du régime détermine le périmètre fiscal prévu. Dans cette maquette, aucun calcul ni aucune donnée de l’application actuelle ne change.</p>${btn('Prévisualiser le changement',"notice('Maquette : confirmation du changement de mode avec date d’effet et conservation de l’historique.')")}<hr><h3>Administration du bien</h3><p class="muted">L’action existante de suppression du bien reste accessible avec confirmation explicite et présentation des conséquences.</p>${btn('Voir la confirmation de suppression',"notice('Maquette uniquement : aucune suppression. L’application actuelle conserve son dialogue de confirmation.')")}</div></section>`;}
return title(P().name,P().type,btn('Comptabilité de ce bien →',"model.fiscalTab='États financiers';go('fiscal')"))+tabs(propertyTabs,'propertyTab')+content;}
function rents(){const months=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];let content='';if(model.rentTab==='Suivi des loyers')content=`<div class="toolbar"><label>Année <select><option>2026</option><option>2025</option></select></label><span class="muted">Encaissements affectés / mois · cliquer pour le détail</span><span class="spacer"></span>${btn('Saisir un solde de départ',"openingBalance()")}</div>`+table(['Locataire',...months,'À recevoir'],['Léa Martin','Alex Bernard','Nora Petit','Sam Robert'].map((n,i)=>[n,...months.map((m,j)=>j<10?`<button class="${i===1&&j===9?'late':''}" onclick="payment('${n}','${m}')">${i===1&&j===9?'300 / 450':'450 €'}</button>`:'—'),i===1?'<strong>150 €</strong>':'0 €']),'rent')+`<div class="note">Une transaction peut être répartie sur plusieurs mois ; plusieurs paiements peuvent couvrir un même mois. Les affectations sont décidées par le propriétaire.</div>`;else if(model.rentTab==='Appels & quittances')content=table(['Bail','Appel de loyer','Envoi','Quittance'],[['Léa · chambre 1','Le 25 de chaque mois','Automatique',btn('Préparer l’envoi',"notice('Maquette : aperçu de la quittance, période et destinataire avant envoi manuel.')")],['Alex · chambre 2','Le 28 de chaque mois','Manuel',btn('Préparer l’envoi',"notice('Maquette : vérifier la période acquittée avant génération et envoi.')")]])+`<div class="card-actions">${btn('Régler les appels par bail',"lease()")}</div>`;else content=`<section class="panel"><h2>${model.rentTab}</h2><p class="muted">Préparer le calcul, le vérifier, puis le valider avant application et e-mail explicatif.</p><div class="fieldgrid"><label>Période <input value="01/01/2026 — 31/12/2026" aria-label="Période de calcul"></label><label>Charges payées par le propriétaire <input value="2 400 €" aria-label="Charges payées"></label></div><div class="note">${model.rentTab==='Régularisation'?'Répartition entre occupants présents, prorata 30/360. Sans occupant, la période reste à la charge du propriétaire. Le calcul final sera spécifié avant développement.':'Les données du bail et l’indice de référence seront présentés avec le détail du calcul.'}</div>${btn('Prévisualiser le détail',"notice('Aucun calcul métier exécuté dans cette maquette ; détail et validation seront conçus dans le parcours dédié.')",true)}</section>`;return title('Loyers & charges',P().name+' · soldes et documents locatifs',btn('Voir les transactions →',"go('transactions')"))+tabs(['Suivi des loyers','Appels & quittances','Révision du loyer','Régularisation'],'rentTab')+content;}

<script>
// Maquette uniquement : lectures GET des endpoints existants, aucune mutation.
const fiscalView={year:2025,tab:'Ma position',part:'Compte de résultat',realized:true,propertyId:25,loadedAt:null};
const readCache=new Map(),pendingReads=new Set(),readErrors=new Map();
const safe=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const euros=(v)=>v===null||v===undefined?'—':Number(v).toLocaleString('fr-FR',{maximumFractionDigits:2,minimumFractionDigits:2})+' €';
const fiscalPaths=['/fiscal/chaine','/reconciliation','/fiscal/repartition','/fiscal/bilan-cerfa','/properties','/compte-resultat/calculate','/bilan/calculate','/amortization/results/aggregated'];
function readExisting(path){
 if(!fiscalPaths.some(p=>path===p||path.startsWith(p+'?')))throw new Error('Lecture non autorisée dans cette maquette');
 if(readCache.has(path))return readCache.get(path);
 if(!pendingReads.has(path)&&!readErrors.has(path)){
  pendingReads.add(path);
  fetch('http://localhost:8000/api'+path,{method:'GET'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(data=>{readCache.set(path,data);fiscalView.loadedAt=new Date().toLocaleTimeString('fr-FR');}).catch(e=>readErrors.set(path,e.message)).finally(()=>{pendingReads.delete(path);render();});
 }
 return null;
}
function waiting(path){return `<section class="panel">${readErrors.has(path)?`Lecture impossible : ${safe(readErrors.get(path))}. Aucun montant de remplacement n’est inventé.`:'Lecture des résultats de l’application existante…'}</section>`;}
function yearControl(){return `<label>Exercice <select aria-label="Exercice fiscal" onchange="fiscalView.year=Number(this.value);render()">${[2021,2022,2023,2024,2025,2026].map(y=>`<option value="${y}" ${y===fiscalView.year?'selected':''}>${y}${y===2026?' · en cours':''}</option>`).join('')}</select></label>`;}
function fiscalTabs(items,key){return `<div class="tabs">${items.map(x=>`<button class="${fiscalView[key]===x?'active':''}" onclick="fiscalView.${key}='${x}';render()">${x}</button>`).join('')}</div>`;}
function numberCard(label,value,desc,tone=''){return `<div class="metric ${tone}"><small>${label}</small><strong>${euros(value)}</strong><small>${desc}</small></div>`;}
function sourceNote(text){return `<p class="source-note">${text} · Lecture seule des résultats actuels${fiscalView.loadedAt?' · '+fiscalView.loadedAt:''}. Les boutons de configuration ouvrent les écrans existants ; aucun paramètre n’est enregistré par la maquette.</p>`;}
function propertyPills(){const p=readExisting('/properties');return p?`<div class="statusline"><strong>Biens du périmètre existant :</strong> ${p.items.map(x=>badge(safe(x.name),'grey')).join(' ')} <span class="muted">· Tous appartements confondus</span></div>`:'';}
function aggregateHeader(){return title('Fiscalité globale · LMNP au réel','Tous les appartements de l’entité, agrégés comme dans l’application actuelle.',btn('Engagement de conservation',"go('guarantee')"))+`<div class="scope-global"><strong>Σ &nbsp; Vue agrégée de l’ensemble des biens</strong><span>Le choix d’un appartement dans Gestion ne filtre pas cette vue.</span></div>`+propertyPills()+`<div class="toolbar">${yearControl()}<span class="spacer"></span>${live('/dashboard/position-fiscale','Comparer avec le module actuel ↗')}</div>`;}
function chainTable(chain){return table(['Exercice','Résultat comptable','Amortissement annuel','Avant amortissement','Amort. déductible','Déficit en réserve','Amort. en réserve','Imposable'],chain.years.map(y=>{const c=chain.chain[y];return [`<button onclick="fiscalView.year=${y};render()">${y}${c.brouillon?' · brouillon':''}</button>`,...['resultat_comptable','amort_annee','r_ha','amort_deductible','deficit_fin_app','amort_fin_app','resultat_fiscal_imposable'].map(k=>euros(c[k]))]}));}
function aggregate(){
 const path='/fiscal/chaine',chain=readExisting(path);let body='';
 if(!chain)return aggregateHeader()+waiting(path);
 const c=chain.chain[fiscalView.year];
 if(!c)return aggregateHeader()+`<section class="panel">Aucun résultat pour cet exercice.</section>`;
 if(fiscalView.tab==='Ma position'){
  body=`<h2>Où j’en suis au 31/12/${fiscalView.year}</h2><div class="metrics fiscal-metrics">${numberCard('Tirelire déficit',c.deficit_fin_app,'Départ : '+euros(c.deficit_depart)+' · mouvement : '+euros(c.deficit_mouvement),'deficit')}${numberCard('Tirelire amortissements',c.amort_fin_app,'Mis de côté : '+euros(c.amort_mis_de_cote)+' · puisé : '+euros(c.amort_impute),'amort')}${numberCard('Résultat imposable',c.resultat_fiscal_imposable,c.brouillon?'Exercice en cours':'Résultat global calculé par le moteur existant')}${numberCard('Total amorti à ce jour',c.amort_total_cumul,'Dont déjà déduit : '+euros(c.amort_deduit_cumul))}</div><section class="panel"><h2>Ce qui s’est passé en ${fiscalView.year}</h2>${table(['Étape existante','Montant'],[['Résultat comptable · tous biens',euros(c.resultat_comptable)],['Amortissement annuel',euros(c.amort_annee)],['Résultat avant amortissement',euros(c.r_ha)],['Amortissement déductible',euros(c.amort_deductible)],['Déficit · mouvement',euros(c.deficit_mouvement)],['Amortissement · mis de côté',euros(c.amort_mis_de_cote)],['Amortissement · imputé',euros(c.amort_impute)],['Résultat fiscal imposable',euros(c.resultat_fiscal_imposable)]])}<div class="card-actions">${btn('Voir le récit et les explications existants',"originalFiscal(1)")}</div></section><section class="panel" style="margin-top:20px"><h2>Comment ça s’est rempli · chaîne complète</h2><p class="muted">Tous les exercices et tous les biens. Cliquer sur une année pour voir sa position.</p>${chainTable(chain)}<details style="margin-top:16px"><summary>Stocks officiels et écarts conservés</summary>${table(['Année','Déficit app','Déficit liasse','Écart','Amort. app','Amort. liasse','Écart'],chain.years.map(y=>{const x=chain.chain[y];return [y,...['deficit_fin_app','deficit_fin_officiel','deficit_ecart','amort_fin_app','amort_fin_officiel','amort_ecart'].map(k=>euros(x[k]))]}))}</details></section>`;
 }else if(fiscalView.tab==='Par appartement'){
  const rp='/fiscal/repartition?jusqua='+fiscalView.year,r=readExisting(rp),recon=readExisting('/reconciliation');
  if(!r)return aggregateHeader()+fiscalTabs(['Ma position','Par appartement','Face à la liasse','Ce qui expire'],'tab')+waiting(rp);
  body=`<div class="metrics fiscal-metrics">${numberCard('Total amorti',r.total,'Cumul de tous les biens')}${numberCard('Déjà déduit',r.deduit,'Déduction calculée par le moteur existant')}${numberCard('Encore en tirelire',r.tirelire,'Réserve globale','amort')}</div><section class="panel"><h2>Répartition de la réserve par appartement</h2>${table(['Appartement','Total amorti','Déjà déduit','En tirelire','Comptabilité'],r.biens.map(b=>[safe(b.nom),euros(b.total),euros(b.deduit),euros(b.tirelire),btn('Ouvrir ce bien',`fiscalView.propertyId=${b.property_id};go('books')`)]).concat([['<strong>TOTAL ENTITÉ</strong>',euros(r.total),euros(r.deduit),euros(r.tirelire),'']]))}<p class="note">${r.exact?'Découpage exact, tel qu’indiqué par le moteur existant.':'Découpage conventionnel au prorata pour les années '+r.annees_au_prorata.join(', ')+'. Cette distinction existante est conservée.'}</p></section>`;
  const yr=recon?.results?.[fiscalView.year];if(yr)body+=`<section class="panel" style="margin-top:20px"><h2>Compte de résultat ${fiscalView.year} · appartements et total</h2>${table(['Poste',...yr.biens_inclus.map(id=>safe(r.biens.find(b=>b.property_id===id)?.nom??id)),'TOTAL APP'],yr.lignes.filter(l=>l.par_bien!==null).map(l=>[safe(l.poste),...yr.biens_inclus.map(id=>euros(l.par_bien[id])),euros(l.app)]))}</section>`;
 }else if(fiscalView.tab==='Face à la liasse'){
  const rc=readExisting('/reconciliation'),bp='/fiscal/bilan-cerfa?year='+fiscalView.year,b=readExisting(bp),yr=rc?.results?.[fiscalView.year];
  if(!yr)return aggregateHeader()+fiscalTabs(['Ma position','Par appartement','Face à la liasse','Ce qui expire'],'tab')+waiting('/reconciliation');
  body=`<div class="note"><strong>L’application est la référence ; la liasse reste un contrôle.</strong> Les colonnes ci-dessous viennent des mêmes endpoints que l’écran actuel.</div><section class="panel"><h2>Compte de résultat agrégé · CERFA 2033-B</h2>${table(['Poste','App · référence','Liasse déposée','Écart'],yr.lignes.map(l=>[safe(l.poste),euros(l.app),euros(l.liasse),euros(l.ecart)]))}</section>`;
  if(b)body+=`<section class="panel" style="margin-top:20px"><div class="head"><h2>Bilan agrégé de l’entité · CERFA 2033-A</h2>${badge('Équilibre : '+euros(b.equilibre),Math.abs(b.equilibre)<.01?'green':'orange')}</div>${table(['Bloc','Case','Poste','App · référence','Liasse','Écart'],b.lignes.map(l=>[safe(l.bloc),safe(l.case),safe(l.libelle),euros(l.app),euros(l.liasse),euros(l.ecart)]))}</section>`;else body+=waiting(bp);
  const explanations=[...yr.lignes,...(b?.lignes??[])].filter(l=>l.explication);
  body+=`<section class="panel" style="margin-top:20px"><h2>Explications des écarts</h2>${explanations.map(l=>`<details><summary>${safe(l.poste??l.libelle)} · ${euros(l.ecart)}</summary><dl>${Object.entries(l.explication).map(([k,v])=>`<dt>${safe(k)}</dt><dd>${safe(typeof v==='object'?JSON.stringify(v):v)}</dd>`).join('')}</dl></details>`).join('')||'<p>Aucune explication d’écart pour cet exercice.</p>'}</section>`;
 }else{
  const tranches=c.deficit_millesimes??[];body=`<section class="panel deficit"><h2>Déficits reportables · échéances des millésimes</h2><p>Stocks renvoyés par l’application pour l’exercice ${fiscalView.year}. Le calcul des délais et les explications restent disponibles dans l’écran existant.</p>${table(['Exercice d’origine','Montant restant','Expiration'],tranches.map(t=>[t.annee,euros(t.montant),'31/12/'+t.expire_fin]))}${tranches.length?'':'<p>Pas de déficit reportable sur cet exercice.</p>'}</section><section class="panel amort" style="margin-top:20px"><h2>Réserve d’amortissements</h2><strong style="font-size:28px">${euros(c.amort_fin_app)}</strong><p>Réserve distincte des déficits, conservée dans le module existant.</p>${live('/dashboard/position-fiscale?onglet=4','Retrouver le délai restant et les explications actuelles ↗')}</section>`;
 }
 return aggregateHeader()+fiscalTabs(['Ma position','Par appartement','Face à la liasse','Ce qui expire'],'tab')+body+sourceNote('Données réelles de la base locale ; format de présentation détaillé pour la maquette');
}
function originalFiscal(n){window.open('http://localhost:3000/dashboard/position-fiscale?onglet='+n,'_blank','noopener');}
function books(){
 const props=readExisting('/properties'),property=props?.items.find(p=>p.id===fiscalView.propertyId),years=[2024,2025,2026],name=property?.name??'Bien';
 const controls=`<div class="toolbar"><label>Appartement <select aria-label="Appartement comptable" onchange="fiscalView.propertyId=Number(this.value);render()">${(props?.items??[]).map(p=>`<option value="${p.id}" ${p.id===fiscalView.propertyId?'selected':''}>${safe(p.name)}</option>`).join('')}</select></label>${btn('Voir tous les biens agrégés →',"go('aggregate')")}</div>`;
 let content='';
 if(fiscalView.part==='Compte de résultat'){
  const path='/compte-resultat/calculate?property_id='+fiscalView.propertyId+'&years='+years.join(',')+'&realized='+fiscalView.realized,d=readExisting(path);
  content=`<div class="toolbar">${btn('Réel',"fiscalView.realized=true;render()",fiscalView.realized)}${btn('Prévisionnel',"fiscalView.realized=false;render()",!fiscalView.realized)}<span class="spacer"></span>${btn('Configuration & prévisions annuelles',"showOriginalTools('Compte de résultat')")}</div>`;
  if(d){const rows=[['Total des produits',...years.map(y=>euros(d.results[y]?.total_produits))]];const products=[...new Set(years.flatMap(y=>Object.keys(d.results[y]?.produits??{})))];products.forEach(k=>rows.push([safe(k),...years.map(y=>euros(d.results[y]?.produits?.[k]??0))]));rows.push(['Total des charges',...years.map(y=>euros(d.results[y]?.total_charges))]);const charges=[...new Set(years.flatMap(y=>Object.keys(d.results[y]?.charges??{})))];charges.forEach(k=>rows.push([safe(k),...years.map(y=>euros(d.results[y]?.charges?.[k]??0))]));rows.push(['<strong>Résultat de l’exercice</strong>',...years.map(y=>'<strong>'+euros(d.results[y]?.resultat_net)+'</strong>')]);content+=table(['Compte de résultat',...years],rows);}else content+=waiting(path);
 }else if(fiscalView.part==='Bilan'){
  const path='/bilan/calculate?property_id='+fiscalView.propertyId+'&years='+years.join(','),d=readExisting(path);
  content=`<div class="toolbar">${btn('Configuration du bilan',"showOriginalTools('Bilan')")}</div>`;
  if(d){let names=[];const yearRows={};for(const y of years){yearRows[y]={};for(const t of d.results[y]?.types??[])for(const sc of t.sub_categories??[])for(const x of sc.categories??[]){const key=t.type+' · '+sc.sub_category+' · '+x.category_name;yearRows[y][key]=x.amount;if(!names.includes(key))names.push(key);}}content+=table(['Bilan',...years],names.map(k=>[safe(k),...years.map(y=>euros(yearRows[y][k]))]).concat(['actif_total','passif_total','difference'].map(k=>['<strong>'+({actif_total:'TOTAL ACTIF',passif_total:'TOTAL PASSIF',difference:'ÉQUILIBRE'})[k]+'</strong>',...years.map(y=>euros(d.results[y]?.[k]))])));}else content+=waiting(path);
 }else{
  const cards=fiscalView.part==='Crédits'?[['Activation par bien','Le réglage « J’ai un crédit » reste au niveau du bien. Sa désactivation conserve son avertissement existant.'],['Configuration des prêts','Nom du prêt, capital, dates, taux, durée, assurance et simulation.'],['Mensualités','Échéancier, montants et détail des remboursements. Import et rapprochement existants conservés.']]:fiscalView.part==='Amortissements'?[['Types et configurations','Tous les types, durées et configurations du bien.'],['Tableau annuel','Agrégations, annuités et cumul des amortissements.'],['Détail des immobilisations','Résultats, transactions sources, filtres et export existants.']]:[['Configurations sauvegardées','Retrouver chaque tableau croisé et ses paramètres.'],['Axes, filtres et mesures','Choix des champs et agrégations existants.'],['Détail des opérations','Passer d’une cellule aux transactions sources et aux exports.']];
  content=`<div class="grid">${cards.map(([h,p])=>`<section class="panel"><h2>${h}</h2><p>${p}</p>${btn('Voir la fonction existante',`showOriginalTools('${fiscalView.part}')`)}</section>`).join('')}</div>`;
 }
 return title('Comptabilité par appartement',safe(name)+' · les outils existants restent la référence.',badge('Aucun moteur remplacé','green'))+controls+fiscalTabs(['Compte de résultat','Bilan','Crédits','Amortissements','Tableau croisé dynamique'],'part')+content+sourceNote('Compte de résultat et bilan : valeurs des endpoints existants, aucun calcul métier ajouté');
}
function showOriginalTools(part){const path=part==='Bilan'?'/dashboard/etats-financiers?tab=bilan':part==='Crédits'?'/dashboard/etats-financiers?tab=credit':part==='Amortissements'?'/dashboard/amortissements':part==='Tableau croisé dynamique'?'/dashboard/pivot':'/dashboard/etats-financiers?tab=compte-resultat';modal(part+' · écran existant conservé',`<p>La maquette n’enregistre aucun réglage. L’écran actuel conserve les configurations, actions, imports et détails.</p><p><strong>Dans l’application actuelle, vérifier le bien sélectionné avant toute action.</strong> Son contexte reste indépendant de cette maquette.</p>${live(path,'Ouvrir le module actuel complet ↗')}`);}
function guarantee(){return title('Engagement de conservation','Le périmètre existant est protégé ; la maquette ajoute des accès et des vues de lecture.')+`<div class="scope-global"><strong>Fiscalité et comptabilité : aucune modification métier autorisée</strong><span>Calculs, agrégations, règles, paramètres, mappings, données et fonctions existantes conservés.</span></div><div class="grid"><section class="panel"><h2>Vérifié aujourd’hui</h2><p><strong>286 fichiers identiques</strong> à la version de référence <code>5619575</code>.</p><p>Les maquettes et documents sont séparés des sources applicatives. Le fichier de typage Next.js généré est exclu de cette comparaison.</p><p>Le manifeste local enregistre les empreintes de la référence pour les contrôles ultérieurs.</p></section><section class="panel"><h2>Condition de livraison</h2><p>À données et paramètres identiques : mêmes sorties et mêmes possibilités d’action. Toute différence inexpliquée bloque la validation de la livraison.</p><p>Les ajouts gestion ne créent pas une deuxième transaction et ne modifient pas les valeurs comptables en affectant un paiement.</p></section></div><section class="panel" style="margin-top:20px"><h2>Contrôles prévus sur chaque lot</h2>${table(['Périmètre','Contrôle'],[['Fiscalité globale','Chaîne multi-exercices, réserves, reports, résultat imposable et imputation'],['Agrégation','Répartition par bien, compte de résultat total, bilan d’entité et écarts liasse'],['Comptabilité par bien','Résultat, bilan, crédits, amortissements, configurations et détails'],['Banque et transactions','Import, catégories, règles, ventilation, solde et synchronisation'],['Navigation','Tous les écrans et actions restent accessibles, global et par bien distincts']])}</section><div class="note">Ce document pose une obligation vérifiable de non-régression. Il ne prétend pas qu’une maquette ou des tests actuels garantissent à eux seuls un développement futur sans erreur.</div>${btn('Voir l’inventaire complet',"go('preservation')")}`;}
const previousRender=render,previousHome=home;
home=function(){const chain=readExisting('/fiscal/chaine');const c=chain?.chain?.[2025];const globalCard=`<section class="panel aggregate-home"><div class="head"><div><h2>Fiscalité globale · tous les biens LMNP au réel</h2><p class="muted">Position de l’entité · exercice 2025 · accès direct aux vues agrégées existantes</p></div>${btn('Ouvrir la vue agrégée →',"go('aggregate')",true)}</div>${c?`<div class="metrics fiscal-metrics">${numberCard('Déficit reportable',c.deficit_fin_app,'Tous biens','deficit')}${numberCard('Amortissements reportés',c.amort_fin_app,'Tous biens','amort')}${numberCard('Résultat imposable',c.resultat_fiscal_imposable,'Résultat de l’entité')}</div>`:'<p>Lecture de la position actuelle…</p>'}<div class="card-actions">${['Ma position','Par appartement','Face à la liasse','Ce qui expire'].map(x=>btn(x,`fiscalView.tab='${x}';go('aggregate')`)).join('')}</div><p class="source-note">Bloc fiscal : données réelles lues dans l’application. Les exemples de gestion locative ci-dessous restent fictifs.</p></section>`;return globalCard+previousHome();};
go=function(page){if(page==='fiscal')page=model.fiscalTab==='Position fiscale globale'?'aggregate':'books';model.page=page;render();window.scrollTo({top:0});};
render=function(){
 if(['aggregate','books','guarantee'].includes(model.page)){
  document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===model.page));document.getElementById('property-select').hidden=true;document.getElementById('scope-label').textContent=model.page==='aggregate'?'Σ Tous les biens · vue agrégée':model.page==='books'?'Comptabilité du bien':'Périmètre protégé';document.getElementById('scope-note').textContent='Lecture seule · application existante inchangée';document.getElementById('screen').innerHTML=({aggregate,books,guarantee}[model.page])();
 }else previousRender();
};
const nav=document.querySelector('[data-nav="fiscal"]');nav.setAttribute('data-nav','aggregate');nav.setAttribute('onclick',"go('aggregate')");nav.textContent='Σ  Fiscalité globale';
nav.insertAdjacentHTML('afterend','<button data-nav="books" onclick="go(\'books\')">▥  Comptabilité par bien</button>');
document.querySelector('.studio span').innerHTML='<strong>MAQUETTE 02</strong> · Fiscalité réelle en lecture seule · Gestion locative fictive · Aucun envoi';
document.querySelector('.studio button').textContent='Garantie de conservation';document.querySelector('.studio button').setAttribute('onclick',"go('guarantee')");
go('aggregate');

</script>

<style>.regime-banner{padding:16px 20px;margin:16px 0;background:#edf4ff;border:1px solid #cadbfa;border-radius:10px}.regime-banner strong{display:block;margin-bottom:6px}.regime-options{display:grid;gap:10px;margin:20px 0}.regime-options label{display:flex;gap:12px;padding:16px;border:1px solid #dfe1e6;border-radius:8px;cursor:pointer}.regime-options label:has(input:checked){background:#edf4ff;border-color:#0052cc}.regime-options input{width:auto}.regime-options small{display:block;color:#5e6c84;margin-top:5px}</style>
<script>
const regimes={evry:'reel',marseille:'reel'};
function regimeLabel(k){return {reel:'LMNP · régime réel',autre:'Autre régime',sci:'SCI'}[regimes[k]];}
function regimePanel(){const included=regimes[model.property]==='reel';return `<section class="panel"><h2>Régime fiscal et prise en compte du bien</h2><p>Ce choix détermine si ce bien entre dans la comptabilité et la fiscalité LMNP au réel existantes.</p><div class="regime-options" role="radiogroup" aria-label="Régime fiscal du bien">${[['reel','LMNP · régime réel','Inclus dans les états comptables et les totaux fiscaux LMNP au réel.'],['autre','Autre régime','Gestion locative et transactions conservées. Exclu des calculs LMNP au réel.'],['sci','SCI','Gestion locative et transactions conservées. Exclu des calculs LMNP au réel ; comptabilité SCI prévue ultérieurement.']].map(([key,label,desc])=>`<label><input type="radio" name="regime" value="${key}" ${regimes[model.property]===key?'checked':''} onchange="regimes[model.property]=this.value;render()"><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</div><div class="regime-banner"><strong>${included?'✓ Inclus dans la finance LMNP existante':'Hors du périmètre LMNP au réel'}</strong>${included?'Ce bien contribuera à la vue agrégée, au compte de résultat, au bilan et aux calculs fiscaux LMNP existants.':'Le bien reste dans Mes biens, avec ses locataires, contrats et transactions. Il ne contribuera pas aux totaux LMNP ; aucun nouveau calcul fiscal n’est disponible pour ce régime.'}</div><p class="muted">Simulation de maquette uniquement : ce choix n’est pas enregistré. Les données historiques et les résultats réels présentés ailleurs ne sont pas modifiés.</p></section>`;}
const propertyBeforeRegime=property;
property=function(){let page=propertyBeforeRegime();if(model.propertyTab==='Réglages du bien'){const marker='<section class="panel"><h2>Paramètres du bien</h2>';page=page.replace(marker,regimePanel()+marker);}else{page+=`<div class="regime-banner"><strong>${regimeLabel(model.property)} · ${regimes[model.property]==='reel'?'Inclus dans la fiscalité existante':'Exclu des calculs LMNP au réel'}</strong>${btn('Modifier le régime fiscal',"model.propertyTab='Réglages du bien';render()")}</div>`;}return page;};
const aggregateBeforeRegime=aggregate;
aggregate=function(){return `<section class="panel" style="margin-bottom:18px"><h2>Périmètre fiscal prévu</h2><p>Seuls les biens réglés sur <strong>LMNP · régime réel</strong> doivent alimenter cette vue. Les biens SCI et les autres régimes restent en gestion, hors calculs LMNP.</p>${btn('Régler le régime de chaque bien',"model.propertyTab='Réglages du bien';go('property')")}<p class="source-note">La vue chiffrée ci-dessous montre encore le périmètre réel de l’application actuelle. Le filtrage proposé n’est pas implémenté et aucune simulation d’exclusion n’est appliquée à ces montants.</p></section>`+aggregateBeforeRegime();};
document.querySelector('.studio span').innerHTML='<strong>MAQUETTE 03</strong> · Régime fiscal par bien · Choix simulés, aucune donnée modifiée';
model.propertyTab='Réglages du bien';go('property');
</script>
