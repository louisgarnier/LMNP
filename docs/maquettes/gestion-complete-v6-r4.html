function candVisit(id){var state=candMemory.visit[id];return `<section class="panel"><h2>Visite du logement</h2><dl><dt>Statut</dt><dd>${state.done?badge('Effectuée','green'):state.planned?badge('Prévue · à confirmer','orange'):badge('À programmer','grey')}</dd><dt>Créneau</dt><dd>${state.planned?'Vendredi 6 novembre 2026 · 18 h 30':'Non défini'}</dd><dt>Rôle dans le workflow</dt><dd>Peut être organisée pendant la collecte des pièces, mais doit être validée avant le bail.</dd></dl><div class="card-actions">${!state.planned?btn('Préparer le rendez-vous',`candPlanVisit('${id}')`):''}${state.planned&&!state.done?btn('Confirmer la visite effectuée',`candConfirmVisit('${id}')`,true):''}${state.done?btn('Voir le rendez-vous',`candPlanVisit('${id}')`):''}</div></section>`;}
function candConfirmVisit(id){modal('Visite effectuée · validation propriétaire',`<p>La visite a été préparée pour ${candCurrent(id).name}. La création du bail restera verrouillée tant que vous n’aurez pas confirmé cette étape.</p><label><input id="cand-visit-confirm" type="checkbox" onchange="document.getElementById('cand-visit-button').disabled=!this.checked"> Je confirme que la visite a eu lieu.</label><div class="card-actions"><button id="cand-visit-button" class="primary" disabled onclick="candMarkVisitDone('${id}')">Valider la visite</button></div>`);}
function candPdf(id,stage){var ready=candAllDocs(id)&&candMemory.visit[id].done;return `<section class="panel"><h2>Dossier candidat · aperçu PDF</h2><p class="muted">Récapitulatif fictif à constituer après les pièces complètes et la visite validée. Le format final suivra l’exemple fourni par le propriétaire.</p>${table(['Section','Contenu'],[['Informations initiales','Identité, situation, projet de location'],['Pièces','6 documents listés, sans fichier réel'],['Garantie','Statut et pièce associée'],['Visite',candMemory.visit[id].done?'Effectuée':'À confirmer']])}<div class="card-actions">${ready?btn('Ouvrir l’aperçu PDF',`candShowPdf('${id}')`):''}${stage==='pdf'&&ready?btn('Valider le dossier et préparer l’entrée',`candAdvance('${id}','move','Validation du dossier',['J’ai lu le récapitulatif et les annexes','Je retiens ce candidat pour l’emménagement'])`,true):''}</div>${!ready?'<p class="muted">Le dossier PDF n’est pas disponible avant pièces complètes et visite validée.</p>':''}</section>`;}
function candShowPdf(id){modal('Aperçu PDF · dossier candidat',`<div class="fiscal-title">DOSSIER CANDIDAT · EXEMPLE</div><h3>${candCurrent(id).name}</h3><p>Informations initiales, situation, garantie, pièces reçues et statut de la visite. Les annexes sont indiquées, mais aucun fichier n’est généré ou stocké.</p>${btn('Retour au dossier',`candidate('${id}')`)}`);}
function candidates(){var counts={};candColumns.forEach(function(x){counts[x[0]]=Object.keys(candData).filter(function(id){return candStage(id)===x[0];}).length;});return title('Candidatures',P().name+' · validation propriétaire à chaque passage',btn('+ Créer un contact','newContact()',true))+`<div class="statusline">${badge('Contacts manuels','grey')}${badge('Leboncoin · connexion à confirmer','orange')}${badge('La Carte des Colocs · connexion à confirmer','orange')}</div><div class="note">Les données sont fictives. Les plateformes, les messages automatiques, les PDF et la signature ne sont pas intégrés ; les écrans détaillent le workflow visé.</div><div class="kanban">${candColumns.map(function(x){return `<section class="column"><h3>${x[1]}<span>${counts[x[0]]}</span></h3>${Object.keys(candData).filter(function(id){return candStage(id)===x[0];}).map(candCard).join('')||'<p class="empty">Aucun dossier à cette étape.</p>'}</section>`;}).join('')}</div>`;}
function candidate(id='camille'){var c=candCurrent(id),stage=candStage(id),ix=candIndex(stage),content=candConversation(id);if(ix>=1)content+=candInitial(c);if(ix>=2)content+=candPieces(id,stage);content+=candVisit(id);if(ix>=4)content+=candPdf(id,stage);if(stage==='contact')content+=`<section class="panel"><h2>Étape suivante</h2><p>Le propriétaire relit le modèle de message avant de le valider pour cette candidature.</p>${btn('Valider le message initial',`candAdvance('${id}','initial','Envoi du message initial',['Le message correspond à cette candidature','Je valide la préparation du message'],'initial')`,true)}</section>`;if(stage==='initial')content+=`<section class="panel"><h2>Validation des informations initiales</h2><p>Les réponses sont affichées ci-dessus. Le propriétaire décide de demander ou non les pièces.</p>${btn('Valider et préparer la demande de pièces',`candAdvance('${id}','pieces','Validation des informations initiales',['Les informations sont complètes','Je valide la préparation de la demande de pièces'],'pieces')`,true)}</section>`;if(stage==='move')content+=`<section class="panel"><h2>Emménagement</h2><p>Les demandes, réceptions et rendez-vous sont suivis séparément avant l’activation.</p>${btn('Ouvrir les conditions d’entrée',`lease('${id}')`,true)}</section>`;modal(`${c.name} · ${c.listing}`,`<p class="muted">${c.summary} · Entrée souhaitée : ${c.entry}</p><div class="statusline">${candSource(c.source)}${badge(candStageName(id),'orange')}</div><div class="progressbar"><span style="width:${Math.max(12,(ix+1)*16)}%"></span></div>${candStep('Contact et message initial',ix>0,ix===0,'Message après validation du propriétaire')}${candStep('Informations initiales',ix>1,ix===1,'Réponses complètes à confirmer')}${candStep('Pièces du dossier',ix>2,ix===2,'Réception et vérification')}${candStep('Visite',candMemory.visit[id].done,ix===3,'Prévue en parallèle, requise avant bail')}${candStep('Dossier PDF',ix>4,ix===4,'Récapitulatif et annexes')}${candStep('Emménagement',false,ix===5,'Bail, assurance, paiements, état des lieux')}${content}`);}
function newContact(){modal('Créer un contact · maquette',`<div class="form"><div class="fieldgrid"><label>Prénom<input id="cand-new-first" value="Nouveau"></label><label>Nom<input id="cand-new-last" value="Contact"></label></div><div class="fieldgrid"><label>E-mail<input id="cand-new-email" type="email" value="candidat@exemple.fr"></label><label>Téléphone<input id="cand-new-phone" value="06 00 00 00 00"></label></div><label>Origine <select id="cand-new-source"><option>Saisie manuelle</option><option>Leboncoin · connexion à confirmer</option><option>La Carte des Colocs · connexion à confirmer</option></select></label><fieldset><legend>Action suivante</legend><label><input type="radio" name="contact-next" checked> Conserver comme contact à qualifier</label><label><input type="radio" name="contact-next"> Préparer le message initial pour validation propriétaire</label></fieldset><p class="muted">Une création ajoute une carte fictive au Kanban local de cette maquette.</p>${btn('Créer le contact de démonstration','candCreateContact()',true)}</div>`);}
function candCreateContact(){var id='manuel-'+(++candMemory.manual),first=document.getElementById('cand-new-first').value||'Nouveau',last=document.getElementById('cand-new-last').value||'Contact',email=document.getElementById('cand-new-email').value||'—',phone=document.getElementById('cand-new-phone').value||'—',source=document.getElementById('cand-new-source').value;candData[id]={name:first+' '+last,email:email,phone:phone,source:source,listing:'Bien à préciser · '+P().name,stage:'contact',summary:'Contact manuel · à qualifier',entry:'—',kind:'Prospect'};candMemory.messages[id]=[];candMemory.initial[id]=false;candMemory.visit[id]={planned:false,done:false};candMemory.docs[id]=[false,false,false,false,false,false];candMemory.entry[id]={signature:'none',insurance:'none',deposit:'none',rent:'none',edl:'none',meeting:'none',blank:'none',report:'none'};document.getElementById('detail').close();go('candidates');}
function candEntryState(id,key){return candMemory.entry[id][key];}
function candEntryAction(id,key,label,target){var wording=target==='requested'?'La demande sera préparée dans le workflow.':target==='received'||target==='signed'?'La réception ou le statut de signature sera confirmé par le propriétaire.':'Cette étape sera confirmée dans le workflow.';modal(label+' · '+candCurrent(id).name,`<p>${wording} Aucun e-mail, paiement, document ou rendez-vous n’est réellement créé.</p><div class="checklist"><label><input id="cand-entry-confirm" type="checkbox" onchange="document.getElementById('cand-entry-button').disabled=!this.checked"> Je confirme cette étape comme propriétaire.</label></div><div class="card-actions"><button id="cand-entry-button" class="primary" disabled onclick="candCommitEntry('${id}','${key}','${target}');">Valider dans la maquette</button></div>`);}
function candCommitEntry(id,key,target){candMemory.entry[id][key]=target;document.getElementById('detail').close();lease(id);}
function candEntryRow(id,key,label,help,required){var state=candEntryState(id,key),done=['signed','received','done','attached'].includes(state),needsRequest=['signature','insurance','deposit','rent'].includes(key),target=state==='none'?(needsRequest?'requested':key==='meeting'?'planned':key==='blank'?'generated':key==='report'?'attached':'done'):(state==='requested'?(key==='signature'?'signed':'received'):state),buttonLabel=done?'Voir le statut':state==='requested'?(key==='signature'?'Confirmer la signature':'Confirmer la réception'):'Préparer la demande';if(!needsRequest&&state==='none')buttonLabel=key==='edl'?'Confirmer l’état des lieux':'Préparer';return `<div class="list-row"><span><strong>${label}</strong><br><small class="muted">${help}</small></span><span>${badge(done?'Réception confirmée':state==='requested'?'Demande préparée':state==='planned'||state==='generated'?'Préparé':'À traiter',done?'green':state==='requested'||state==='planned'||state==='generated'?'orange':'grey')} ${btn(buttonLabel,`candEntryAction('${id}','${key}','${label}','${target}')`)}</span></div>`;}
function lease(id='camille'){var c=candCurrent(id),visit=candMemory.visit[id];if(!visit.done){modal('Bail verrouillé · visite requise',`<p>Le bail de <strong>${c.name}</strong> ne peut pas être préparé tant que la visite n’a pas été confirmée par le propriétaire.</p><p class="muted">La collecte des pièces et le dossier PDF peuvent continuer en parallèle.</p>${btn('Retour au dossier',`candidate('${id}')`)}`);return;}var e=candMemory.entry[id],active=['signature','insurance','deposit','rent','edl'].every(function(k){return ['signed','received','done'].includes(e[k]);});modal(`Emménagement · ${c.name}`,`<p class="muted">Aucune signature, demande, réception ou génération n’est réelle dans cette maquette.</p><section class="panel"><h2>Bail et signature</h2><p>Variables prévues : type de location, date d’effet, loyer, charges, dépôt, échéance, garanties et annexes. Modèle de bail : à fournir. Fournisseur de signature électronique : à choisir.</p><div class="card-actions">${btn('Aperçu des variables du bail',`candLeasePreview('${id}')`)}${candEntryRow(id,'signature','Signature du bail','Demande de signature puis statut reçu du fournisseur.',true)}</div></section><section class="panel"><h2>Paiements et assurance</h2>${candEntryRow(id,'deposit','Dépôt de garantie','Demande de paiement, puis réception à confirmer.',true)}${candEntryRow(id,'rent','Premier loyer','Demande de paiement, puis réception à confirmer.',true)}${candEntryRow(id,'insurance','Assurance habitation','Demande d’attestation, puis réception à confirmer.',true)}</section><section class="panel"><h2>État des lieux et rendez-vous</h2>${candEntryRow(id,'meeting','Rendez-vous état des lieux','Créneau d’entrée à préparer.',false)}${candEntryRow(id,'blank','État des lieux vierge','Document de travail à générer.',false)}${candEntryRow(id,'report','Rapport du prestataire','Dépôt du rapport ou rattachement au prestataire.',false)}${candEntryRow(id,'edl','État des lieux d’entrée effectué','Validation finale du propriétaire.',true)}</section><div class="note">Activation requise : bail signé, assurance reçue, dépôt reçu, premier loyer reçu et état des lieux effectué.</div><div class="card-actions"><button class="primary" ${active?'':'disabled'} onclick="candActivate('${id}')">Valider l’entrée comme propriétaire</button></div>`);}
function candLeasePreview(id){modal('Aperçu du bail · variables',`<p>Identité des parties, bien, date d’effet, durée, loyer, charges, dépôt, garanties, annexes et signatures. Le contenu final dépendra du modèle fourni.</p>${btn('Retour à l’emménagement',`lease('${id}')`)}`);}
function candActivate(id){modal('Activation du locataire · confirmation',`<p>Les cinq conditions requises sont confirmées pour <strong>${candCurrent(id).name}</strong>.</p><label><input id="cand-final-confirm" type="checkbox" onchange="document.getElementById('cand-final-button').disabled=!this.checked"> Je confirme l’entrée comme propriétaire.</label><div class="card-actions"><button class="primary" id="cand-final-button" disabled onclick="document.getElementById('detail').close();go('property')">Confirmer dans la maquette</button></div>`);}

</script>

<script>
// Maquette : état local en mémoire uniquement. Aucune écriture vers l'application.
const contextIds={evry:25,marseille:15,coloc:26};
Object.assign(properties.evry,{name:'Évry',type:'Colocation · 5 chambres · exemple de gestion'});
Object.assign(properties.marseille,{name:'mars',type:'Logement entier · exemple de gestion'});
properties.coloc={name:'mars colloc',type:'Colocation · bail commun · exemple de gestion',mode:'Bail commun',rent:'1 200 €',occupancy:'2 colocataires'};regimes.coloc='reel';
let ownerEmail='proprietaire@exemple.fr',mockTxFilter='Toutes',mockTxSearch='';
const scopeStatus=()=>regimes[model.property]==='reel'?'Inclus LMNP au réel':'Hors calculs LMNP';
const coreBooks=books,coreAggregate=aggregateBeforeRegime;
const txExamples=[{id:'t1',date:'26/10/2026',label:'Virement Léa',amount:450,category:'Loyers',link:'Léa · octobre',kind:'Loyer'},{id:'t2',date:'25/10/2026',label:'Virement Alex',amount:300,category:'Loyers',link:'Alex · octobre',kind:'Loyer'},{id:'t3',date:'22/10/2026',label:'État des lieux · partenaire',amount:-120,category:'Honoraires',link:'Intervention entrée',kind:'Dépense'},{id:'t4',date:'21/10/2026',label:'Dépôt de garantie',amount:820,category:'À confirmer dans Finance',link:'À affecter',kind:'Dépôt'}];
function chooseContext(k){if(properties[k]){model.property=k;fiscalView.propertyId=contextIds[k];}render();}
changeProperty=chooseContext;
function openBooksFor(id){const k=Object.keys(contextIds).find(k=>contextIds[k]===id);if(k)model.property=k;fiscalView.propertyId=id;go('books');}
go=function(page){if(page==='fiscal')page=model.fiscalTab==='Position fiscale globale'?'aggregate':'books';if(page==='books'){const k=Object.keys(contextIds).find(k=>contextIds[k]===fiscalView.propertyId);if(k)model.property=k;}model.page=page;render();window.scrollTo({top:0});};
function navigateBooks(){fiscalView.propertyId=contextIds[model.property];go('books');}
function demoLogin(){return title('Votre espace propriétaire','Maquette de l’entrée V1 : adresse e-mail seule, confirmation par code en V2.')+`<section class="panel" style="max-width:520px;margin:40px auto"><h2>Accéder à mon espace</h2><form onsubmit="event.preventDefault();ownerEmail=document.getElementById('owner-mail').value;go('home')"><label>Adresse e-mail<input id="owner-mail" aria-label="E-mail propriétaire" type="email" required value="${safe(ownerEmail)}" style="width:100%;margin:12px 0"></label><button class="primary">Continuer dans la démonstration</button></form><p class="note">Les données affichées sont un seul espace de démonstration. Aucune adresse réelle n’est authentifiée et aucun e-mail n’est envoyé. L’isolation entre propriétaires devra être vérifiée lors de l’implémentation.</p></section>`;}
function home(){return title('Votre portefeuille','Gestion locative et accès à vos outils financiers existants.',btn('Ajouter un bien',"newProperty()",true))+`<div class="scope-global"><strong>Fiscalité globale · LMNP au réel</strong><span>Une vue d’ensemble distincte de la gestion de chaque appartement.</span><div class="card-actions">${btn('Ouvrir les totaux et la chaîne fiscale',"go('aggregate')")}${btn('Voir les biens inclus / exclus',"scopeDialog()")}</div></div><div class="metrics">${[['Biens',Object.keys(properties).length],['Contrats démo','7'],['Paiement à compléter','150 €'],['Candidatures à examiner','3']].map(([k,v])=>`<div class="metric"><small>${k}</small><strong>${v}</strong><small>Gestion : données de démonstration</small></div>`).join('')}</div><div class="grid">${Object.entries(properties).map(([k,p])=>`<section class="panel"><div class="property-card"><div class="building">⌂</div><div><h2>${p.name}</h2><p>${p.type}</p>${badge(regimeLabel(k),regimes[k]==='reel'?'green':'orange')} ${badge(regimes[k]==='reel'?'Inclus LMNP':'Exclu LMNP','grey')}</div></div><div class="list-row"><span>Location</span><strong>${p.mode}</strong></div><div class="list-row"><span>Occupation · démo</span><strong>${p.occupancy}</strong></div><div class="card-actions">${btn('Gérer le bien',`chooseContext('${k}');model.propertyTab='Vue du bien';go('property')`,true)}${btn('Transactions',`chooseContext('${k}');go('transactions')`)}${btn('Comptabilité',`chooseContext('${k}');navigateBooks()`)}</div></section>`).join('')}</div><p class="note">La gestion locative utilise des exemples fictifs. Les vues fiscales indiquent explicitement quand elles lisent les données réelles de l’application.</p>`;}
function scopeDialog(){modal('Périmètre de la finance LMNP',table(['Bien','Réglage simulé','Prise en compte prévue'],Object.keys(properties).map(k=>[properties[k].name,regimeLabel(k),regimes[k]==='reel'?'Inclus':'Exclu']))+`<p class="note">Ces réglages restent dans cette session. Aucun filtre n’est appliqué au moteur réel. Les chiffres existants ne sont pas recalculés dans la maquette.</p>${btn('Modifier le bien actif',"document.getElementById('detail').close();model.propertyTab='Réglages du bien';go('property')")}`);}
aggregateHeader=function(){return title('Fiscalité globale','Résultats réels existants · lecture seule',btn('Périmètre des biens',"scopeDialog()"))+`<div class="scope-global"><strong>Σ Position de l’entité · tous les biens du périmètre actuel</strong><span>Le sélecteur d’un appartement ne filtre pas cette vue.</span></div><section class="panel"><h2>Périmètre prévu dans la nouvelle application</h2>${table(['Bien','Régime simulé','Futurs totaux LMNP'],Object.keys(properties).map(k=>[properties[k].name,regimeLabel(k),regimes[k]==='reel'?badge('Inclus','green'):badge('Exclu','orange')]))}<p class="note"><strong>Filtre non appliqué aux chiffres ci-dessous.</strong> Les résultats réels restent ceux de l’application actuelle. Le futur filtrage devra préserver les règles de calcul et les résultats lorsque tous les biens sont au réel.</p></section><div class="toolbar">${yearControl()}${live('/dashboard/position-fiscale','Ouvrir le module fiscal actuel complet ↗')}</div>`;};
aggregate=function(){return coreAggregate().replaceAll(/fiscalView.propertyId=(\d+);go\('books'\)/g,'openBooksFor($1)');};
books=function(){fiscalView.propertyId=contextIds[model.property];if(regimes[model.property]!=='reel')return title('Comptabilité · '+P().name,'Périmètre simulé : '+regimeLabel(model.property))+`<section class="panel"><h2>Bien hors du module LMNP au réel</h2><p>Les loyers, contrats et transactions restent disponibles. La comptabilité SCI et les autres moteurs fiscaux seront ajoutés ultérieurement.</p>${btn('Transactions du bien',"go('transactions')")}${btn('Modifier le régime',"model.propertyTab='Réglages du bien';go('property')")}<p class="note">Aucune donnée comptable réelle n’est supprimée ni modifiée.</p></section>`;return coreBooks().replace('onchange="fiscalView.propertyId=Number(this.value);render()"','onchange="openBooksFor(Number(this.value))"')+`<div class="note">Contexte partagé : ${P().name}. Le module actuel ouvert dans un autre onglet conserve sa propre sélection ; vérifier le bien dans cet onglet.</div>`;};
function txDetail(id){const t=txExamples.find(x=>x.id===id);modal('Transaction · '+t.label,`<div class="statusline">${badge('Exemple de gestion','grey')}${badge(P().name)}</div>${table(['Donnée','Valeur'],[['Date',t.date],['Montant',euros(t.amount)],['Catégorie comptable',t.category],['Nature locative',t.kind],['Lien de gestion',t.link]])}<h3 style="margin-top:20px">Une opération bancaire, plusieurs affectations possibles</h3><p>L’affectation locative est un lien supplémentaire. Elle ne modifie ni le montant ni la catégorie comptable.</p><div class="card-actions">${t.amount>0?btn('Affecter le paiement',"assign()",true):btn('Voir l’intervention',"document.getElementById('detail').close();go('partners')")}${live('/dashboard/transactions','Éditer dans le module existant ↗')}</div><p class="muted">Les données de cette fenêtre sont fictives ; aucune opération réelle modifiée.</p>`);}
transactions=function(){let content='';if(model.txTab==='Toutes les transactions'){const rows=txExamples.filter(t=>(mockTxFilter==='Toutes'||t.kind===mockTxFilter)&&t.label.toLowerCase().includes(mockTxSearch.toLowerCase()));content=`<div class="toolbar"><label>Rechercher<input aria-label="Recherche transactions" value="${safe(mockTxSearch)}" onchange="mockTxSearch=this.value;render()"></label><label>Nature<select aria-label="Nature transaction" onchange="mockTxFilter=this.value;render()">${['Toutes','Loyer','Dépôt','Dépense'].map(v=>`<option ${mockTxFilter===v?'selected':''}>${v}</option>`).join('')}</select></label>${btn('Importer / gérer les opérations existantes',"txExisting()")}</div>`+table(['Date','Opération','Catégorie','Montant','Lien gestion','Détail'],rows.map(t=>[t.date,t.label,t.category,euros(t.amount),t.link,btn('Voir '+t.label,`txDetail('${t.id}')`)]))+`<p class="note">Exemples de transactions. Les filtres et affectations ci-dessus n’écrivent rien dans Finance. Toutes les fonctions de classement, import et banque restent dans l’application existante.</p>`;}else{const inventory={'Boîte de réception':['Opérations à classer','Catégories proposées et règles','Ventilation et validation groupée'],'Import relevés':['Sélection CSV et aperçu','Correspondance des colonnes','Contrôle doublons et confirmation','Historique des imports'],'Règles':['Règles du bien et règles globales','Création, modification, activation','Priorités et application'],'Paramètres':['Catégories et correspondances','Enable Banking : banque et consentement','Compte associé au bien','Synchronisation et déconnexion']}[model.txTab];content=`<section class="panel"><h2>${model.txTab} · module existant conservé</h2>${table(['Fonctions disponibles dans l’application actuelle'],inventory.map(x=>[x]))}<div class="card-actions">${btn('Ouvrir les outils existants',"txExisting()",true)}</div></section>`;if(model.txTab==='Paramètres')content+=`<section class="panel" style="margin-top:18px"><h2>Compte bancaire du bien</h2><label>Compte associé · exemple<select><option>Compte dédié à ${P().name} · •••• 1234</option><option>Aucun compte associé</option></select></label><p>V1 : un compte par bien. La connexion et la synchronisation utilisent Enable Banking déjà intégré.</p><p class="muted">Le rattachement ci-dessus est illustratif. Aucune connexion ni synchronisation déclenchée par la maquette.</p></section>`;}return title('Transactions · '+P().name,'Opérations existantes et affectations locatives, sans duplication.',badge(scopeStatus(),'grey'))+tabs(txTabs,'txTab')+content;};
function txExisting(){const paths={'Toutes les transactions':'','Boîte de réception':'?tab=inbox','Import relevés':'?tab=load_trades','Règles':'?tab=rules','Paramètres':'?tab=parametres'};modal('Retrouver le module existant',`<p>Ouvrir ${model.txTab} dans l’application actuelle. Vérifier sa sélection de bien : <strong>${P().name}</strong>.</p>${live('/dashboard/transactions'+paths[model.txTab],'Ouvrir '+model.txTab+' ↗')}<p class="note">La maquette ne remplace pas ces outils et ne change pas leurs paramètres.</p>`);}
function walkthrough(){return title('Parcours de revue','Chaque groupe d’exigences a un accès dédié ; les actions sont simulées.')+table(['Parcours','Ouvrir'],[['Entrée et compte',btn('Écran e-mail',"go('login')")],['Biens, chambres, diagnostics, assurances, documents',btn('Fiche du bien',"model.propertyTab='Informations';go('property')")],['Régimes et historique',btn('Réglages du bien',"model.propertyTab='Réglages du bien';go('property')")],['Locataires, baux et garants',btn('Locataires',"model.propertyTab='Locataires';go('property')")],['Annonces, messagerie et candidatures',btn('Kanban',"go('candidates')")],['Paiements, documents, révision et charges',btn('Loyers',"go('rents')")],['Rapports et interventions',btn('Prestataires',"go('partners')")],['Tous les biens / périmètre LMNP',btn('Fiscalité globale',"go('aggregate')")],['Fonctions existantes',btn('Inventaire',"go('preservation')")]])+`<p class="note">Modèles de bail/dossier, prestataire de signature, capacités des plateformes et règles détaillées de calcul restent à confirmer avant implémentation. Les écrans rendent ces étapes visibles sans prétendre que les intégrations fonctionnent.</p>`;}
render=function(){const global=['home','aggregate','settings','preservation','guarantee','walkthrough','login'].includes(model.page);document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===model.page));const select=document.getElementById('property-select');select.innerHTML=Object.keys(properties).map(k=>`<option value="${k}" ${k===model.property?'selected':''}>${properties[k].name}</option>`).join('');select.hidden=global;document.getElementById('scope-label').textContent=global?'Espace propriétaire':'Bien actif';document.getElementById('scope-note').textContent=global?'Gestion simulée · Finance existante en lecture seule':P().name+' · '+scopeStatus();const routes={home,property,rents,candidates,transactions,books,aggregate,partners,settings,preservation,guarantee,walkthrough,login:demoLogin};document.getElementById('screen').innerHTML=(routes[model.page]??home)();document.querySelectorAll('[onclick]').forEach(el=>{const action=el.getAttribute('onclick');if(action==="model.fiscalTab='États financiers';go('fiscal')")el.setAttribute('onclick','navigateBooks()');});};
document.querySelector('.studio span').innerHTML='<strong>MAQUETTE 06</strong> · Gestion fictive, actions simulées · Aucun envoi ni écriture dans l’application';
document.querySelector('.studio button').textContent='Parcours de revue';document.querySelector('.studio button').setAttribute('onclick',"go('walkthrough')");
document.querySelector('.account').innerHTML='<strong>Espace propriétaire</strong><br>Démo privée<br>'+btn('Écran de connexion',"go('login')")+'<p>Accès prestataires · V2</p>';
go('home');

</script>

<script>
// Présenter les saisies sans écriture ni document réel.
window.propPreview=function(message){const open=document.getElementById('detail').open;const source=open?document.getElementById('detail'):document.getElementById('screen');const fields=Array.from(source.querySelectorAll('input,select,textarea')).filter(el=>el.type!=='radio'||el.checked).map(el=>[el.getAttribute('aria-label')||el.closest('label')?.textContent.trim().split('\n')[0]||'Champ',el.type==='file'?(Array.from(el.files??[]).map(f=>f.name).join(', ')||'Aucun fichier choisi'):el.type==='checkbox'?(el.checked?'Oui':'Non'):el.value]);modal('Aperçu de la saisie',`<p>${safe(message)}</p>${table(['Champ','Valeur saisie'],fields.map(([k,v])=>[safe(k),safe(v)]))}<p class="note">Aperçu de maquette : aucune sauvegarde réelle, aucun téléversement. Les fichiers choisis restent sur votre appareil.</p>`);};
newProperty=function(){modal('Ajouter un bien · démonstration',`<form onsubmit="event.preventDefault();demoCreateProperty()"><div class="fieldgrid"><label>Intitulé<input id="new-name" required placeholder="Nom du bien"></label><label>Adresse<input id="new-address" placeholder="Adresse complète"></label><label>Surface m²<input type="number" min="1" value="60"></label><label>Étage<input type="number" value="1"></label><label>Pièces<input type="number" min="1" value="3"></label><label>Chambres<input id="new-rooms" type="number" min="0" value="2"></label><label>Mode de location<select id="new-mode"><option>Logement entier</option><option>Colocation · bail commun</option><option>Chambres · baux individuels</option><option>Courte durée</option></select></label><label>Régime fiscal<select id="new-regime"><option value="reel">LMNP · régime réel — inclus</option><option value="autre">Autre régime — exclu</option><option value="sci">SCI — exclu</option></select></label></div><p class="note">Le bien sera ajouté uniquement à cette démonstration en mémoire. Aucun nouveau dossier comptable réel ne sera créé.</p><button class="primary">Créer dans la maquette</button></form>`);};
function demoCreateProperty(){const name=document.getElementById('new-name').value.trim();if(!name)return;const k='demo'+Date.now();properties[k]={name:safe(name),type:'Nouveau bien de démonstration',mode:document.getElementById('new-mode').value,rent:'À renseigner',occupancy:'Aucun bail saisi'};regimes[k]=document.getElementById('new-regime').value;model.property=k;model.propertyTab='Réglages du bien';document.getElementById('detail').close();go('property');}
const mappedBooks=books;
books=function(){if(!contextIds[model.property])return title('Comptabilité · '+P().name,'Nouveau bien de démonstration')+`<section class="panel"><h2>Aucun dossier comptable réel associé</h2><p>Ce bien a été créé seulement dans la maquette. Son régime est ${regimeLabel(model.property)}. L’application réelle et ses chiffres sont inchangés.</p>${btn('Revenir à la fiche',"go('property')")}</section>`;return mappedBooks();};
const scopedCandidates=candidates;
candidates=function(){if(model.property!=='evry')return title('Candidatures · '+P().name,'Aucun candidat enregistré dans cet exemple.')+`<section class="panel"><h2>Préparer la prochaine mise en location</h2><p>Les exemples du Kanban sont rattachés à Évry. Ils ne sont pas copiés dans les autres biens.</p>${btn('Voir le scénario complet à Évry',"chooseContext('evry');go('candidates')",true)}</section>`;return scopedCandidates();};
const scopedTransactions=transactions;
transactions=function(){if(model.property!=='evry'&&model.txTab==='Toutes les transactions')return title('Transactions · '+P().name,'Exemples locatifs séparés par bien')+tabs(txTabs,'txTab')+`<section class="panel"><h2>Aucune affectation locative simulée pour ce bien</h2><p>Les transactions réelles restent dans le module actuel.</p>${btn('Ouvrir Transactions existant',"txExisting()")}${btn('Voir les affectations de démonstration à Évry',"chooseContext('evry');go('transactions')")}</section>`;return scopedTransactions();};
render();
const demoRooms={evry:Array.from({length:5},(_,i)=>({name:'Chambre '+(i+1),surface:12+i,rent:410,charges:40}))};
const detailedProperty=property;
property=function(){let html=detailedProperty();if(model.propertyTab==='Réglages du bien'){const rooms=demoRooms[model.property]??[];html+=`<section class="panel"><h2>Chambres et lots locatifs</h2><p>Pour les baux individuels, chaque chambre peut être rattachée à un contrat. Pour un bail commun, aucune chambre n’est attribuée à un signataire.</p>${table(['Chambre','Surface','Loyer HC','Charges',''],rooms.map((r,i)=>[safe(r.name),r.surface+' m²',euros(r.rent),euros(r.charges),btn('Modifier '+r.name,`demoRoom(${i})`)]))}<div class="card-actions">${btn('Ajouter une chambre',"demoRoom(-1)")}</div></section>`;}return html;};
function demoRoom(i){const r=(demoRooms[model.property]??[])[i]??{name:'Nouvelle chambre',surface:12,rent:410,charges:40};modal('Définir une chambre',`<form onsubmit="event.preventDefault();demoSaveRoom(${i})"><div class="fieldgrid"><label>Nom de la chambre<input id="room-name" required value="${safe(r.name)}"></label><label>Surface m²<input id="room-surface" type="number" min="1" value="${r.surface}"></label><label>Loyer hors charges<input id="room-rent" type="number" min="0" value="${r.rent}"></label><label>Charges<input id="room-charges" type="number" min="0" value="${r.charges}"></label></div><p class="note">Enregistrement de démonstration uniquement ; aucun bail existant n’est modifié.</p><button class="primary">Enregistrer dans la maquette</button></form>`);}
function demoSaveRoom(i){const val=id=>document.getElementById(id).value;const room={name:val('room-name'),surface:Number(val('room-surface')),rent:Number(val('room-rent')),charges:Number(val('room-charges'))};if(!demoRooms[model.property])demoRooms[model.property]=[];if(i<0)demoRooms[model.property].push(room);else demoRooms[model.property][i]=room;document.getElementById('detail').close();render();}
const explainedRegularisation=rentRegularisation;
rentRegularisation=function(){return `<section class="panel"><h2>Préparer les charges à répartir</h2><p>Saisir les dépenses payées, leurs périodes et les justificatifs avant d’examiner la répartition.</p>${btn('Ajouter une charge payée',"demoCharge()",true)}${btn('Vérifier les dates d’occupation',"demoOccupation()")}</section>`+explainedRegularisation();};
function demoCharge(){modal('Saisie d’une charge payée',`<div class="form"><label>Libellé<input aria-label="Libellé de charge" value="Charges copropriété"></label><label>Montant payé<input aria-label="Montant payé" type="number" value="1440"></label><div class="fieldgrid"><label>Début de période<input type="date" value="2026-01-01"></label><label>Fin de période<input type="date" value="2026-12-31"></label></div><label>Justificatif<input type="file"></label><label>Transaction existante<select><option>Dépense à rattacher</option><option>Choisir plus tard</option></select></label><label>Part à répartir<input value="À vérifier selon le bail"></label>${btn('Prévisualiser la ligne',"propPreview('Charge saisie : la répartition reste à valider. Les totaux de l’exemple figé ne sont pas recalculés.')",true)}</div>`);}
function demoOccupation(){modal('Dates d’occupation · scénario de régularisation',table(['Occupant','Entrée','Sortie'],[['Léa Martin','01/04/2026','31/12/2026'],['Alex Bernard','01/04/2026','31/12/2026'],['Nora Petit','01/04/2026','31/12/2026'],['Sam Robert','01/04/2026','31/12/2026']])+`<p class="note">Scénario illustratif distinct des baux du tableau des loyers : aucune occupation du 1er janvier au 31 mars. L’implémentation utilisera les dates réelles des baux et des provisions effectivement versées.</p>`);}
const revisionPreviewMail=rentRevisionMail,chargesPreviewMail=rentRegularisationMail;
rentRevisionMail=function(){revisionPreviewMail();if(!rentDemo.revisionValidated)document.querySelectorAll('#detail button').forEach(b=>{if(b.textContent.includes('Simuler l’envoi')){b.disabled=true;b.title='Validez la révision avant l’envoi';}});};
rentRegularisationMail=function(){chargesPreviewMail();if(!rentDemo.regularisationValidated)document.querySelectorAll('#detail button').forEach(b=>{if(b.textContent.includes('Simuler l’envoi')){b.disabled=true;b.title='Validez la régularisation avant l’envoi';}});};
render();
const demoTenants={evry:[['Léa Martin','Chambre 1','01/01/2026',410,40,'Visale'],['Alex Bernard','Chambre 2','01/01/2026',410,40,'Garant physique'],['Nora Petit','Chambre 3','01/01/2026',410,40,'Visale'],['Sam Robert','Chambre 4','01/04/2026',410,40,'Visale']],marseille:[['Robin Moreau','Logement entier','01/06/2025',900,80,'Visale']],coloc:[['Inès Laurent et Mehdi Benali','Bail commun · sans chambres attribuées','01/03/2026',1100,100,'Garant physique']]};
function tenantData(name){return (demoTenants[model.property]??[]).find(t=>t[0]===name)??[name,'À définir','À définir',0,0,'À renseigner'];}
const coherentProperty=property;
property=function(){if(!['Locataires','Contrats & garants'].includes(model.propertyTab))return coherentProperty();const items=demoTenants[model.property]??[];return title(P().name,'Locations de démonstration · personnes et contrats conservés séparément')+tabs(propertyTabs,'propertyTab')+`<section class="panel"><h2>${model.propertyTab==='Locataires'?'Locataires actuels':'Baux et garanties en cours'}</h2>${table(['Locataire(s)','Lot / bail','Début','Loyer CC','Garant','Détails'],items.map(t=>[t[0],t[1],t[2],euros(t[3]+t[4]),t[5],btn('Fiche '+t[0],`tenant('${t[0]}')`)+btn('Bail '+t[0],`propContract('${t[0]}')`)]))}<div class="card-actions">${btn('Saisir une location existante',"propNewTenant()")}${btn('Créer un bail pour un candidat',"demoChooseCandidate()")}${btn('Consulter les anciens contrats',"propArchives()")}</div><p class="note">Bail commun : un seul loyer pour les signataires, aucune attribution de chambre. La répartition des paiements entre signataires sera précisée avant implémentation.</p></section>`;};
function demoChooseCandidate(){modal('Créer un bail depuis un dossier validé',`<p>Le dossier doit être vérifié et la visite effectuée. Le scénario complet de démonstration est disponible à Évry.</p>${btn('Ouvrir les candidatures à Évry',"document.getElementById('detail').close();chooseContext('evry');go('candidates')",true)}`);}
window.propContract=function(name){const t=tenantData(name);modal('Bail · '+name,`${table(['Information','Valeur'],[['Bien',P().name],['Locataire(s)',name],['Lot / type de bail',t[1]],['Début',t[2]],['Durée / renouvellement','1 an · renouvelable · exemple'],['Loyer hors charges',euros(t[3])],['Charges · provisions',euros(t[4])],['Loyer total du bail',euros(t[3]+t[4])],['Échéance / modalité','Le 5 · à échoir'],['Dépôt de garantie · exemple',euros(t[3])],['Révision / indice','Dernière révision : aucune · IRL trimestre 2 (exemple)'],['Assurance habitation','Attestation à consulter · début '+t[2]+' · couverture annuelle'],['État des lieux entrée','Rapport démo · '+t[2]],['Préavis','Aucun préavis déclaré']])}<div class="card-actions">${btn('Garantie et justificatifs',`demoGuarantee('${name}')`)}${btn('Préparer la sortie',`departure('${name}')`)}</div><p class="note">Variables illustratives ; le modèle de contrat sera fourni avant génération réelle.</p>`);};
function demoGuarantee(name){const t=tenantData(name);modal('Garantie · '+name,table(['Champ','Valeur'],t[5]==='Visale'?[['Type','Garantie Visale'],['Référence','VISALE-DEMO'],['Bail / locataire',name],['Document','Acte de garantie — exemple']]:[['Type','Garant physique'],['Nom','Garant de démonstration'],['E-mail','garant@exemple.fr'],['Téléphone','06 00 00 00 00'],['Adresse','Adresse à renseigner'],['Bail / locataire',name],['Document','Acte de cautionnement — exemple']])+`<label>Joindre un acte<input type="file"></label><p class="note">Pièce locale de démonstration : aucun fichier envoyé.</p>`);}
tenant=function(name='Léa Martin'){const t=tenantData(name);modal('Locataire · '+name,table(['Information','Valeur'],[['Bien',P().name],['Identité',name],['Contact e-mail',name.split(' ')[0].toLowerCase()+'@exemple.fr'],['Téléphone','06 00 00 00 00'],['Contrat',t[1]],['Entrée',t[2]],['Solde',name==='Alex Bernard'?'150 € à recevoir':'À jour'],['Dossier','Pièces d’identité, situation et justificatifs — exemple'],['Assurance','Attestation à consulter · début '+t[2]]])+`<div class="card-actions">${btn('Voir le bail',`propContract('${name}')`)}${btn('Voir le garant',`demoGuarantee('${name}')`)}${btn('Préparer la sortie',`departure('${name}')`)}</div>`);};
departure=function(name='Léa Martin'){const t=tenantData(name);modal('Sortie · '+name,`<div class="fieldgrid"><label>Préavis reçu le<input type="date" value="2026-10-02"></label><label>Départ validé<input type="date" value="2026-11-02"></label><label>Document de préavis<input type="file"></label><label>Rendez-vous état des lieux<input type="datetime-local" value="2026-11-02T10:00"></label><label>Rapport de sortie<input type="file"></label><label>Dépôt reçu<input id="exit-deposit" type="number" value="${t[3]}"></label><label>Retenues justifiées<input id="exit-withheld" type="number" value="0"></label><label>Solde locatif à examiner<input id="exit-balance" value="${name==='Alex Bernard'?'150':'0'}"></label><label>Montant à restituer validé<input id="exit-refund" type="number" value="${t[3]}"></label><label>Date de restitution<input id="exit-date" type="date" value="2026-11-15"></label></div><div class="checklist">${['Préavis validé','État des lieux réalisé et rapport reçu','Solde locatif examiné','Retenues et restitution validées','Historique prêt à archiver'].map(x=>`<label><input type="checkbox" data-exit-check onchange="document.getElementById('exit-close').disabled=document.querySelectorAll('[data-exit-check]:checked').length!==5">${x}</label>`).join('')}</div><div class="card-actions">${btn('Aperçu restitution',"demoExitSummary(false)")}<button id="exit-close" disabled onclick="demoExitSummary(true)">Prévisualiser la clôture</button></div><p class="note">Aucun remboursement automatique. Le propriétaire examine séparément le solde et les retenues.</p>`);};
function demoExitSummary(close){const v=id=>safe(document.getElementById(id).value);const rows=[['Dépôt reçu',v('exit-deposit')+' €'],['Retenues',v('exit-withheld')+' €'],['Solde examiné',v('exit-balance')+' €'],['Restitution proposée',v('exit-refund')+' €'],['Date',v('exit-date')]];modal(close?'Clôture prête à confirmer · simulation':'Aperçu de restitution',table(['Poste','Valeur'],rows)+`<p class="note">${close?'Les cinq validations ont été cochées. Contrat, pièces et soldes resteront archivés.':'Le propriétaire valide les montants et les justificatifs avant toute restitution.'} Aucun transfert ni clôture réel.</p>`);}
render();

</script>

#gestion{font-size:14px}#gestion .studio{position:sticky;top:0;z-index:5;background:#e9eff9}#gestion aside{position:sticky;top:45px;height:calc(100vh - 45px);box-sizing:border-box}#gestion .panel + .panel{margin-top:18px}#gestion .grid>.panel{margin-top:0}#gestion textarea{font:inherit;width:100%;min-height:95px;border:1px solid #dfe1e6;border-radius:6px;padding:10px;box-sizing:border-box}#gestion input,#gestion select{max-width:100%;box-sizing:border-box}#gestion input[type=checkbox],#gestion input[type=radio]{width:auto!important;accent-color:#0052cc}#gestion button:disabled{opacity:.45;cursor:not-allowed}#gestion dialog{width:min(850px,94vw)}#gestion dialog .tabs{flex-wrap:wrap}#gestion summary{cursor:pointer;padding:12px 0;font-weight:600}#gestion .form{margin:15px 0}#gestion .fieldgrid label{display:grid;gap:6px}#gestion .card-actions a{padding:8px}#gestion .scope-global{margin-bottom:20px}#gestion .metric{min-width:0}#gestion h1{font-size:26px}#gestion .panel .table-wrap{margin-top:12px}#gestion .checklist{margin:16px 0}#gestion .tabs{scrollbar-width:thin}#gestion :focus-visible{outline:3px solid #8eb8ff;outline-offset:2px}
