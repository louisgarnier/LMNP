<style>
body > .header, body > .indicator-bar{display:none!important}body > .main{padding:0!important;max-width:none!important;margin:0!important}
body{margin:0!important;background:#f4f5f7!important;color:#172b4d!important;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif!important}.container{max-width:none!important;padding:0!important}body>header,body>footer{display:none!important}*{box-sizing:border-box}#gestion{font-size:14px;line-height:1.5}#gestion button,#gestion select,#gestion input{font:inherit}#gestion button,#gestion a{cursor:pointer}#gestion button{border:1px solid #dfe1e6;border-radius:6px;padding:8px 12px;background:white;color:#172b4d}#gestion button:hover{background:#edf3fd}#gestion button:focus-visible,#gestion a:focus-visible{outline:3px solid #73a5ef;outline-offset:2px}#gestion button:disabled{opacity:.45;cursor:not-allowed}#gestion button.primary{background:#0052cc;color:white;border-color:#0052cc}#gestion .studio{background:#e9eff9;padding:9px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-size:12px}#gestion .studio button{padding:4px 10px;font-size:12px}#gestion .shell{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 48px)}#gestion aside{background:#f9fafc;border-right:1px solid #dfe1e6;padding:24px 14px;display:flex;flex-direction:column;gap:5px}#gestion .brand{font-size:22px;font-weight:750;letter-spacing:-1px;padding:0 12px 24px}#gestion .brand span{color:#0052cc}#gestion .section-label{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#6b778c;margin:20px 12px 8px;font-weight:700}#gestion aside button{border:0;background:transparent;text-align:left;padding:11px 12px}#gestion aside button.active{color:#0052cc;background:#e7effc;font-weight:650}#gestion .account{margin-top:auto;padding:24px 12px 0;font-size:12px;color:#5e6c84}#gestion .workspace{min-width:0}#gestion .topbar{height:66px;background:white;border-bottom:1px solid #dfe1e6;display:flex;justify-content:space-between;align-items:center;padding:0 30px;gap:12px}#gestion .context{display:flex;gap:12px;align-items:center}#gestion select,#gestion input{border:1px solid #dfe1e6;background:white;border-radius:5px;padding:8px 10px;color:#172b4d}#gestion main{max-width:1400px;margin:auto;padding:28px 30px 60px}#gestion h1{font-size:27px;letter-spacing:-.6px;margin:0 0 4px;font-weight:700}#gestion h2{font-size:17px;margin:0 0 14px}#gestion h3{font-size:14px;margin:0 0 8px}#gestion p{margin:5px 0 16px}#gestion .muted{color:#5e6c84}#gestion .head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}#gestion .badge{display:inline-block;background:#e8f1ff;color:#0052cc;border-radius:4px;font-size:10px;font-weight:700;padding:3px 7px;vertical-align:middle}#gestion .green{background:#e5f3ed;color:#17694e}#gestion .orange{background:#fff1d9;color:#895400}#gestion .grey{background:#edf0f5;color:#5e6c84}#gestion .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}#gestion .metric,#gestion .panel{background:white;border:1px solid #dfe1e6;border-radius:9px;padding:20px}#gestion .metric strong{display:block;font-size:26px;letter-spacing:-.6px;margin:6px 0}#gestion .metric small{color:#5e6c84}#gestion .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}#gestion .wide{grid-column:1/-1}#gestion .tabs{display:flex;gap:4px;border-bottom:1px solid #dfe1e6;margin:0 0 22px;overflow-x:auto}#gestion .tabs button{white-space:nowrap;border:0;border-radius:0;background:transparent;padding:12px 14px;border-bottom:2px solid transparent}#gestion .tabs button.active{color:#0052cc;border-bottom-color:#0052cc;font-weight:650}#gestion .table-wrap{overflow-x:auto;border:1px solid #dfe1e6;border-radius:8px;background:white}#gestion table{width:100%;border-collapse:collapse;font-size:13px}#gestion th{background:#f7f8fa;color:#5e6c84;text-align:left;font-size:11px;font-weight:600;padding:12px 14px;white-space:nowrap}#gestion td{border-top:1px solid #edf0f5;padding:14px}#gestion td.money{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}#gestion .toolbar{display:flex;gap:10px;align-items:center;margin:18px 0;flex-wrap:wrap}#gestion .toolbar .spacer{flex:1}#gestion .note{background:#f0f5fc;border-left:3px solid #0052cc;padding:13px 16px;border-radius:4px;margin:16px 0;font-size:13px}#gestion .property-card{display:grid;grid-template-columns:72px 1fr;gap:17px;align-items:start}#gestion .building{height:72px;background:#e8eef6;border-radius:9px;display:grid;place-items:center;color:#1e3a5f;font-size:32px}#gestion .card-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}#gestion dl{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin:0}#gestion dt{color:#5e6c84}#gestion dd{margin:0}#gestion .list-row{padding:13px 0;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:15px}#gestion .list-row:last-child{border:0}#gestion .kanban{display:flex;gap:14px;overflow:auto;padding-bottom:18px}#gestion .column{flex:0 0 220px;background:#edf0f5;border-radius:8px;padding:12px;min-height:340px}#gestion .column h3{display:flex;justify-content:space-between;font-size:12px}#gestion .candidate{width:100%;background:white!important;display:block;text-align:left;padding:15px!important;margin-top:14px}#gestion .candidate strong{display:block;margin:9px 0 3px}#gestion .candidate small{display:block;color:#5e6c84;margin:8px 0}#gestion .column .empty{font-size:12px;color:#7a869a;margin-top:24px}#gestion .preserve td:first-child{font-weight:600;min-width:160px}#gestion .link{color:#0052cc;text-decoration:none}#gestion .statusline{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}#gestion .checklist label{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #edf0f5}#gestion .checklist input{accent-color:#0052cc}#gestion dialog{width:min(600px,92vw);max-height:90vh;overflow:auto;border:1px solid #dfe1e6;border-radius:12px;padding:28px;color:#172b4d;box-shadow:0 20px 90px #172b4d40}#gestion dialog::backdrop{background:#172b4d65}#gestion .dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}#gestion .form{display:grid;gap:14px}#gestion .form label{display:grid;gap:5px}#gestion .comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px}#gestion .fiscal-title{background:#1e3a5f;color:white;padding:16px;border-radius:6px 6px 0 0}#gestion .progressbar{height:5px;background:#e8edf4;border-radius:3px;overflow:hidden;margin:16px 0}#gestion .progressbar span{height:100%;background:#0052cc;display:block}#gestion .toast{position:fixed;bottom:22px;right:22px;max-width:400px;background:#172b4d;color:white;padding:15px 20px;border-radius:8px;z-index:20}#gestion .hidden{display:none}#gestion .rent td{padding:12px 9px;text-align:center;white-space:nowrap}#gestion .rent td:first-child{text-align:left;position:sticky;left:0;background:white}#gestion .rent button{padding:4px 6px;font-size:12px;border:0;background:#e5f3ed;color:#17694e}#gestion .rent button.late{background:#fff1d9;color:#895400}#gestion .reviewbar{font-size:12px;color:#5e6c84;margin-top:24px}#gestion .fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:950px){#gestion .metrics{grid-template-columns:repeat(2,1fr)}#gestion .shell{grid-template-columns:180px minmax(0,1fr)}#gestion main{padding:22px 18px}#gestion .topbar{padding:0 18px}#gestion .grid{grid-template-columns:1fr}}@media(max-width:650px){#gestion .shell{display:block}#gestion aside{flex-direction:row;overflow:auto;padding:8px;position:relative}#gestion aside button{white-space:nowrap}#gestion .brand,#gestion .section-label,#gestion .account{display:none}#gestion .head{align-items:flex-start;flex-direction:column}#gestion .studio{align-items:flex-start}#gestion .comparison{grid-template-columns:1fr}#gestion .topbar{height:auto;padding:12px;flex-wrap:wrap}#gestion .fieldgrid{grid-template-columns:1fr}}
</style>
<div id="gestion">
<div class="studio"><span><strong>MAQUETTE 01 · révision 3</strong> · Navigation & parcours · Données fictives · Aucun envoi ni modification réelle</span><button onclick="go('preservation')">Existant → nouvelle application</button></div>
<div class="shell"><aside><div class="brand">lmnp<span>.</span> <small style="font-size:12px;letter-spacing:0">gestion</small></div><button data-nav="home" onclick="go('home')">▦ &nbsp; Vue d’ensemble</button><div class="section-label">Gestion locative</div><button data-nav="property" onclick="go('property')">⌂ &nbsp; Mes biens</button><button data-nav="candidates" onclick="go('candidates')">▤ &nbsp; Candidatures</button><button data-nav="rents" onclick="go('rents')">€ &nbsp; Loyers & charges</button><div class="section-label">Finance existante</div><button data-nav="transactions" onclick="go('transactions')">⇄ &nbsp; Transactions</button><button data-nav="fiscal" onclick="go('fiscal')">▥ &nbsp; Comptabilité & fiscalité</button><div class="section-label">Organisation</div><button data-nav="partners" onclick="go('partners')">♧ &nbsp; Prestataires</button><button data-nav="settings" onclick="go('settings')">⚙ &nbsp; Réglages</button><div class="account"><strong>Espace propriétaire</strong><br>proprietaire@exemple.fr<br><span class="badge grey">Accès partenaires · V2</span></div></aside>
<div class="workspace"><div class="topbar"><div class="context"><span class="muted" id="scope-label">Portefeuille</span><select aria-label="Bien sélectionné" id="property-select" onchange="changeProperty(this.value)"><option value="evry">Évry · Les Miroirs</option><option value="marseille">Marseille · Le Patio</option></select></div><span class="muted" id="scope-note">Gestion et finance du même bien</span></div><main id="screen"></main></div></div>
<dialog id="detail"><div id="dialog-content"></div></dialog><div id="toast" role="status" class="toast hidden"></div>
</div>
<script>
const model={page:'home',property:'evry',propertyTab:'Vue du bien',txTab:'Toutes les transactions',fiscalTab:'Position fiscale globale',fiscalSub:'Ma position',rentTab:'Suivi des loyers',assigned:false,created:false,advance:false};
const properties={evry:{name:'Évry · Les Miroirs',type:'Colocation · 5 chambres · 105 m²',mode:'Baux individuels',rent:'2 250 €',occupancy:'4 / 5 chambres'},marseille:{name:'Marseille · Le Patio',type:'Appartement · 3 pièces · 62 m²',mode:'Logement entier',rent:'980 €',occupancy:'Loué'}};
const P=()=>properties[model.property];
const btn=(label,action,primary=false)=>`<button class="${primary?'primary':''}" onclick="${action}">${label}</button>`;
const badge=(label,color='')=>`<span class="badge ${color}">${label}</span>`;
const table=(heads,rows,cls='')=>`<div class="table-wrap"><table class="${cls}"><thead><tr>${heads.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const title=(name,desc,action='')=>`<div class="head"><div><h1>${name}</h1><p class="muted">${desc}</p></div>${action}</div>`;
const tabs=(items,key)=>`<div class="tabs">${items.map(x=>btn(x,`model.${key}='${x}';render()`).replace('class=""',`class="${model[key]===x?'active':''}"`)).join('')}</div>`;
const live=(path,label='Ouvrir l’écran actuel ↗')=>`<a class="link" target="_blank" rel="noopener" href="http://localhost:3000${path}">${label}</a>`;
function go(page){model.page=page;render();window.scrollTo({top:0});}
function changeProperty(value){model.property=value;render();}
function notice(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),4200);}
function modal(heading,content){document.getElementById('dialog-content').innerHTML=`<div class="dialog-head"><h2>${heading}</h2>${btn('Fermer',"document.getElementById('detail').close()")}</div>${content}`;document.getElementById('detail').showModal();}
function home(){return title('Votre patrimoine, au même endroit','La gestion quotidienne de vos biens, avec votre comptabilité toujours à portée de main.')+`<div class="metrics"><div class="metric"><small>Biens</small><strong>2</strong><small>Votre portefeuille</small></div><div class="metric"><small>Loyers attendus · octobre</small><strong>2 780 €</strong><small>5 contrats en cours</small></div><div class="metric"><small>Reste à recevoir</small><strong>150 €</strong><small>1 paiement partiel</small></div><div class="metric"><small>À valider</small><strong>3 dossiers</strong><small>Votre décision est attendue</small></div></div><div class="head"><h2>Mes biens</h2>${btn('+ Ajouter un bien',"newProperty()")}</div><div class="grid">${Object.entries(properties).map(([k,p])=>`<section class="panel"><div class="property-card"><div class="building">⌂</div><div><h2>${p.name}</h2><p class="muted">${p.type}</p>${badge(p.mode,'grey')} ${badge(p.occupancy,k==='evry'?'orange':'green')}</div></div><div class="list-row"><span>Résultat net comptable</span><span class="muted">Carte existante conservée</span></div><div class="list-row"><span>Loyer à pleine occupation</span><strong>${p.rent} / mois</strong></div><div class="card-actions">${btn('Gérer le bien',`model.property='${k}';go('property')`,true)}${btn('Transactions',`model.property='${k}';go('transactions')`)}${btn('Comptabilité',`model.property='${k}';model.fiscalTab='États financiers';go('fiscal')`)}</div></section>`).join('')}<section class="panel"><h2>À faire aujourd’hui</h2><div class="list-row"><span>Dossier de Camille · pièces reçues</span>${btn('Examiner',"candidate()")}</div><div class="list-row"><span>Virement de 450 € · locataire à préciser</span>${btn('Rattacher',"assign()")}</div><div class="list-row"><span>Alex · 150 € restant à recevoir</span>${btn('Voir le solde',"go('rents')")}</div></section><section class="panel"><h2>Votre position fiscale</h2><p class="muted">Retrouvez la position globale, les résultats par appartement, le contrôle des liasses et les reports qui expirent.</p>${badge('Module existant conservé','green')}<div class="card-actions">${btn('Ouvrir la fiscalité globale',"model.fiscalTab='Position fiscale globale';go('fiscal')")}</div></section></div>`;}
const propertyTabs=['Vue du bien','Informations','Locataires','Contrats & garants','Documents','Annonces','Réglages du bien'];
function property(){let content='';switch(model.propertyTab){case 'Vue du bien':content=`<div class="grid"><section class="panel"><h2>Occupation</h2>${table(['Lot','Occupation','Loyer'],model.property==='evry'?[['Chambre 1','Léa Martin','450 €'],['Chambre 2','Alex Bernard','450 €'],['Chambre 3','Nora Petit','450 €'],['Chambre 4','Sam Robert','450 €'],['Chambre 5',badge('À louer','orange'),'450 €']]:[['Logement entier','Robin Moreau','980 €']])}<div class="card-actions">${btn('Suivre les loyers',"go('rents')",true)}${btn('Chercher un locataire',"go('candidates')")}</div></section><section class="panel"><h2>Gestion du bien</h2><dl><dt>Mode de location</dt><dd>${P().mode}</dd><dt>Banque</dt><dd>Compte du bien · Enable Banking</dd><dt>Régime indiqué</dt><dd>LMNP au réel</dd><dt>Documents</dt><dd>DPE · assurance PNO · syndic</dd></dl><div class="card-actions">${btn('Voir les informations',"model.propertyTab='Informations';render()")}</div><hr style="border:0;border-top:1px solid #edf0f5;margin:24px 0"><h2>Finance du même bien</h2><p class="muted">Un accès direct à vos outils actuels.</p><div class="card-actions">${btn('Transactions',"go('transactions')")}${btn('Bilan & résultat',"model.fiscalTab='États financiers';go('fiscal')")}</div></section></div>`;break;
case 'Informations':content=`<div class="grid">${[['Informations principales',[['Intitulé',P().name],['Type','Appartement'],['Surface',model.property==='evry'?'105 m²':'62 m²'],['Pièces / chambres',model.property==='evry'?'6 pièces · 5 chambres':'3 pièces']]],['Informations complémentaires',[['Chauffage','Collectif'],['Eau chaude','Collective'],['Chaudière individuelle','Non'],['Accès immeuble','Renseigné dans le dossier privé']]],['Diagnostics techniques',[['DPE / GES','D / B'],['Rapport DPE','diagnostic-exemple.pdf'],['Électricité / gaz','Documents à renseigner'],['Plomb, amiante, risques','Documents à renseigner']]],['Finances & assurances',[['Taxe foncière / CFE','Avis annuels et justificatifs'],['Acquisition / prêt','Informations et documents'],['PNO / emprunteur','Contrats et attestations'],['Rappels automatiques','Non prévus en V1']]],['Immeuble & syndic',[['Régime','Copropriété'],['Syndic','Coordonnées à compléter'],['Construction','Année à renseigner'],['Contacts','E-mail et téléphone']]]].map(([h,rows])=>`<section class="panel"><h2>${h}</h2><dl>${rows.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl><div class="card-actions">${btn('Modifier',`editInfo('${h}')`)}</div></section>`).join('')}</div>`;break;
case 'Locataires':content=table(['Locataire','Bail','État','Accès'],[['Léa Martin','Chambre 1',badge('En cours','green'),btn('Voir la fiche',"tenant()")],['Alex Bernard','Chambre 2',badge('150 € à recevoir','orange'),btn('Voir la fiche',"tenant()")],['Anciens locataires','Historique',badge('Conservé','grey'),btn('Voir les archives',"notice('Archives : contrats, documents et soldes conservés — aperçu de navigation.')")]]);break;
case 'Contrats & garants':content=`<section class="panel"><h2>Baux et garanties</h2>${table(['Contrat','Conditions','Garant',''],[['Léa · chambre 1','410 € + 40 € de charges','Visale',btn('Voir le contrat',"lease()")],['Alex · chambre 2','410 € + 40 € de charges','Personne physique',btn('Voir le contrat',"lease()")]])}<p class="reviewbar">Bail commun : plusieurs signataires, sans chambre attribuée. Les contrats passés restent consultables.</p></section>`;break;
case 'Documents':content=table(['Document','Rattachement','Type',''],[['DPE — exemple','Bien','Diagnostic',badge('Fichier démo','grey')],['Attestation PNO — exemple','Bien','Assurance',badge('Fichier démo','grey')],['Bail signé — exemple','Léa · chambre 1','Contrat',btn('Voir le parcours',"lease()")],['État des lieux — exemple','Léa · chambre 1','Entrée',btn('Intervention associée',"go('partners')")]])+`<div class="card-actions">${btn('Déposer un document',"notice('Maquette : dépôt manuel, choix du type et rattachement au bien ou au contrat.')")}</div>`;break;
case 'Annonces':content=`<div class="grid"><section class="panel"><h2>Chambre lumineuse en colocation · Évry</h2><p>Chambre meublée dans un appartement partagé, cuisine équipée et espaces communs. Disponible à partir du 15 novembre.</p><div class="statusline">${badge('450 € / mois','grey')}${badge('6 photos enregistrées','grey')}</div><div class="card-actions">${btn('Préparer l’annonce',"editInfo('Annonce et photos')",true)}${btn('Voir les candidatures',"go('candidates')")}</div></section><section class="panel"><h2>Diffusion</h2><div class="list-row">Leboncoin ${badge('Connexion à étudier','orange')}</div><div class="list-row">La Carte des Colocs ${badge('Connexion à étudier','orange')}</div><p class="muted">Conserver le contenu pour publier ou réactiver rapidement. Les actions disponibles dépendront des intégrations confirmées.</p></section></div>`;break;
default:content=`<section class="panel"><h2>Paramètres du bien</h2><div class="form"><label>Mode de location<select><option>${P().mode}</option><option>Colocation · bail commun</option><option>Location par chambre</option><option>Courte durée</option></select></label><p class="muted">Les changements conservent l’historique des contrats. Le régime fiscal affiché ne modifie aucun calcul existant.</p>${btn('Prévisualiser le changement',"notice('Maquette : confirmation du changement de mode avec date d’effet et conservation de l’historique.')")}<hr><h3>Administration du bien</h3><p class="muted">L’action existante de suppression du bien reste accessible avec confirmation explicite et présentation des conséquences.</p>${btn('Voir la confirmation de suppression',"notice('Maquette uniquement : aucune suppression. L’application actuelle conserve son dialogue de confirmation.')")}</div></section>`;}
return title(P().name,P().type,btn('Comptabilité de ce bien →',"model.fiscalTab='États financiers';go('fiscal')"))+tabs(propertyTabs,'propertyTab')+content;}
function rents(){const months=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];let content='';if(model.rentTab==='Suivi des loyers')content=`<div class="toolbar"><label>Année <select><option>2026</option><option>2025</option></select></label><span class="muted">Encaissements affectés / mois · cliquer pour le détail</span><span class="spacer"></span>${btn('Saisir un solde de départ',"openingBalance()")}</div>`+table(['Locataire',...months,'À recevoir'],['Léa Martin','Alex Bernard','Nora Petit','Sam Robert'].map((n,i)=>[n,...months.map((m,j)=>j<10?`<button class="${i===1&&j===9?'late':''}" onclick="payment('${n}','${m}')">${i===1&&j===9?'300 / 450':'450 €'}</button>`:'—'),i===1?'<strong>150 €</strong>':'0 €']),'rent')+`<div class="note">Une transaction peut être répartie sur plusieurs mois ; plusieurs paiements peuvent couvrir un même mois. Les affectations sont décidées par le propriétaire.</div>`;else if(model.rentTab==='Appels & quittances')content=table(['Bail','Appel de loyer','Envoi','Quittance'],[['Léa · chambre 1','Le 25 de chaque mois','Automatique',btn('Préparer l’envoi',"notice('Maquette : aperçu de la quittance, période et destinataire avant envoi manuel.')")],['Alex · chambre 2','Le 28 de chaque mois','Manuel',btn('Préparer l’envoi',"notice('Maquette : vérifier la période acquittée avant génération et envoi.')")]])+`<div class="card-actions">${btn('Régler les appels par bail',"lease()")}</div>`;else content=`<section class="panel"><h2>${model.rentTab}</h2><p class="muted">Préparer le calcul, le vérifier, puis le valider avant application et e-mail explicatif.</p><div class="fieldgrid"><label>Période <input value="01/01/2026 — 31/12/2026" aria-label="Période de calcul"></label><label>Charges payées par le propriétaire <input value="2 400 €" aria-label="Charges payées"></label></div><div class="note">${model.rentTab==='Régularisation'?'Répartition entre occupants présents, prorata 30/360. Sans occupant, la période reste à la charge du propriétaire. Le calcul final sera spécifié avant développement.':'Les données du bail et l’indice de référence seront présentés avec le détail du calcul.'}</div>${btn('Prévisualiser le détail',"notice('Aucun calcul métier exécuté dans cette maquette ; détail et validation seront conçus dans le parcours dédié.')",true)}</section>`;return title('Loyers & charges',P().name+' · soldes et documents locatifs',btn('Voir les transactions →',"go('transactions')"))+tabs(['Suivi des loyers','Appels & quittances','Révision du loyer','Régularisation'],'rentTab')+content;}
function candidates(){const columns=['Contact','Informations initiales','Pièces du dossier','Visite','Dossier PDF','Emménagement'];return title('Candidatures',P().name+' · chaque passage est validé par le propriétaire',btn('+ Créer un contact',"newContact()",true))+`<div class="statusline">${badge('Leboncoin','grey')}${badge('La Carte des Colocs','grey')}${badge('Contacts manuels','grey')}</div><p class="muted">La visite se prépare en parallèle du dossier. « Visite effectuée » est obligatoire avant la création du bail.</p><div class="kanban">${columns.map((c,i)=>`<section class="column"><h3>${c}<span>${i===2?2:i<2?1:0}</span></h3>${i===0&&model.created?'<button class="candidate" onclick="candidate()"><strong>Nouveau contact démo</strong><small>Saisie manuelle · à qualifier</small></button>':''}${i===0?`<button class="candidate" onclick="candidate()">${badge('Leboncoin','grey')}<strong>Robin D.</strong><small>Chambre 5 · premier message</small><span>Réponses à demander →</span></button>`:i===1?`<button class="candidate" onclick="candidate()">${badge('Manuel','grey')}<strong>Lou M.</strong><small>Entrée souhaitée · 15 novembre</small><span>À valider par vous →</span></button>`:i===2?`<button class="candidate" onclick="candidate()">${badge('La Carte des Colocs','grey')}<strong>Camille D.</strong><small>6 / 6 pièces reçues · visite à faire</small>${badge(model.advance?'Informations validées':'Votre validation attendue','orange')}</button><button class="candidate" onclick="candidate()"><strong>Alex P.</strong><small>3 / 6 pièces reçues</small><span>En attente du candidat</span></button>`:'<p class="empty">Les candidatures apparaîtront ici après votre validation.</p>'}</section>`).join('')}</div><div class="note">Pendant l’emménagement : contrat signé, assurance reçue, dépôt et premier loyer payés, état des lieux effectué. Aucun dossier ne devient locataire sans votre validation finale.</div>`;}
const txTabs=['Toutes les transactions','Boîte de réception','Import relevés','Règles','Paramètres'];
function transactions(){const paths=['','?tab=inbox','?tab=load_trades','?tab=rules','?tab=parametres'];let content='';if(model.txTab==='Toutes les transactions')content=`<div class="toolbar"><input aria-label="Rechercher une transaction" placeholder="Rechercher une transaction…"><span class="spacer"></span>${btn('Ajouter / ventiler',"notice('Les actions de saisie et ventilation existantes restent accessibles dans Transactions.')")}</div>`+table(['Date','Libellé','Catégorie existante','Montant','Lien gestion locative'],[['26 oct.','Virement Léa','Loyer hors charges','+450 €',model.assigned?badge('Léa · octobre','green'):btn('Attribuer au locataire',"assign()")],['25 oct.','Virement Alex','Loyer hors charges','+300 €',badge('Alex · octobre','green')],['22 oct.','État des lieux · prestataire','Honoraires','−120 €',btn('Voir l’intervention',"go('partners')")]])+`<div class="note">La colonne « Lien gestion locative » complète les opérations existantes. Catégories, règles, ventilation, imports et calculs restent dans leur fonctionnement actuel.</div>`;else{const desc={'Boîte de réception':['Classer et valider les opérations','Catégories, règles proposées, ventilation, actions groupées et retour vers toutes les transactions.'],'Import relevés':['Importer un relevé CSV','Choix du fichier, aperçu des colonnes, détection des doublons, confirmation et historique des imports.'],'Règles':['Retrouver les règles de classement','Création, activation, priorités, modification et application des règles existantes.'],'Paramètres':['Catégories et banque du bien','Paramètres existants, catégories, connexion Enable Banking et synchronisation du compte du bien.']}[model.txTab];content=`<section class="panel"><h2>${desc[0]}</h2><p>${desc[1]}</p>${badge('Fonctionnalité existante conservée','green')}<div class="card-actions">${live('/dashboard/transactions'+paths[txTabs.indexOf(model.txTab)])}</div></section>`;}return title('Transactions',P().name+' · une source commune à la gestion et à la comptabilité',badge('Existant + liens locatifs','green'))+tabs(txTabs,'txTab')+content+`<p class="reviewbar">Proposition : une entrée Transactions autonome dans la navigation. ${live('/dashboard/transactions','Comparer à l’application actuelle ↗')}</p>`;}
function fiscal(){const options=['Position fiscale globale','États financiers','Amortissements','Tableau croisé dynamique'];let content='';if(model.fiscalTab==='Position fiscale globale')content=tabs(['Ma position','Par appartement','Face à la liasse','Ce qui expire'],'fiscalSub')+`<section class="panel"><h2>${model.fiscalSub}</h2><p>Votre module de position fiscale actuel, tous biens confondus : récit par exercice, chaîne fiscale, reports et comparaison avec les liasses.</p><div class="statusline">${badge('Portée : tous les biens','grey')}${badge('Calculs existants inchangés','green')}</div><div class="card-actions">${live('/dashboard/position-fiscale?onglet='+(['Ma position','Par appartement','Face à la liasse','Ce qui expire'].indexOf(model.fiscalSub)+1))}</div></section>`;else if(model.fiscalTab==='États financiers')content=`<div class="fiscal-title">${P().name} · États financiers existants</div><section class="panel"><div class="card-actions">${live('/dashboard/etats-financiers?tab=compte-resultat','Compte de résultat ↗')}${live('/dashboard/etats-financiers?tab=bilan','Bilan ↗')}${live('/dashboard/etats-financiers?tab=credit','Crédit ↗')}</div><div class="grid" style="margin-top:22px"><div><h3>Compte de résultat</h3><p class="muted">Réel / prévisionnel, prévisions annuelles, configurations, détails et exports.</p></div><div><h3>Bilan</h3><p class="muted">Tableau, configurations, contrôles et détails existants.</p></div><div><h3>Crédit</h3><p class="muted">Activation « J’ai un crédit », prêts, simulation et mensualités.</p></div></div></section>`;else content=`<section class="panel"><h2>${model.fiscalTab} · ${P().name}</h2><p>${model.fiscalTab==='Amortissements'?'Configurations par type, calcul, tableaux, annuités, détails et exports conservés.':'Configurations sauvegardées, axes, filtres, agrégations, détail des opérations et exports conservés.'}</p>${live(model.fiscalTab==='Amortissements'?'/dashboard/amortissements':'/dashboard/pivot')}</section>`;return title('Comptabilité & fiscalité','Vos outils actuels, regroupés et accessibles depuis chaque bien.',badge('Module existant préservé','green'))+tabs(options,'fiscalTab')+content+`<p class="reviewbar">Ces cadres montrent l’emplacement des écrans existants, sans inventer de nouveaux résultats fiscaux. Les liens ouvrent l’application actuelle avec sa propre sélection de bien.</p>`;}
function partners(){return title('Prestataires','Fiches et interventions renseignées par le propriétaire en V1.',badge('Accès prestataire · V2','grey'))+table(['Prestataire','Mission','Bien','Document','Transaction'],[['État des lieux — partenaire démo','Entrée · 15 novembre',P().name,'Rapport à déposer',btn('Lier une dépense',"go('transactions')")],['Ménage — partenaire démo','Contact courte durée',P().name,'Coordonnées conservées','—']])+`<div class="note">Airbnb / Booking : coordonnées du gestionnaire et de la personne chargée du ménage uniquement. Pas de réservations ni de calendrier en V1.</div>`;}
function settings(){return title('Réglages','Votre espace et les connexions existantes.')+`<div class="grid"><section class="panel"><h2>Profil propriétaire</h2><label>Adresse e-mail <input aria-label="Adresse e-mail" value="proprietaire@exemple.fr"></label><p class="muted">Saisie d’adresse en V1. Confirmation par code en V2.</p>${badge('Aucun accès locataire','grey')}</section><section class="panel"><h2>Banque & connexions</h2><p>Enable Banking est déjà intégré. Retrouvez les réglages et la synchronisation dans les paramètres Transactions du bien.</p>${btn('Ouvrir les paramètres bancaires',"model.txTab='Paramètres';go('transactions')",true)}</section><section class="panel"><h2>Envois locatifs</h2><p>Appels de loyer : date et mode d’envoi par bail. Quittances et relances : envoi manuel.</p>${btn('Régler un bail',"lease()")}</section><section class="panel"><h2>Partenaires</h2><p>Leurs fiches sont disponibles en V1. Invitations et droits d’accès seront définis en V2.</p>${badge('Invitations non disponibles','grey')}</section></div>`;}
const preserved=[['Accueil et sélection du bien','Vue d’ensemble / Mes biens','Liste, création, sélection, résultat net par bien et suppression avec confirmation','/'],['Transactions','Transactions → Toutes','Tableau, recherche, tri, filtres, pagination, catégories, édition, suppression, saisie, ventilation et actions groupées','/dashboard/transactions'],['Boîte de réception','Transactions → Boîte de réception','Classement, règles proposées et validation','/dashboard/transactions?tab=inbox'],['Import bancaire','Transactions → Import relevés','CSV, aperçu, correspondance des colonnes, doublons, historique','/dashboard/transactions?tab=load_trades'],['Règles et catégories','Transactions → Règles / Paramètres','Règles propres au bien ou globales, configuration et classement existants','/dashboard/transactions?tab=rules'],['Enable Banking','Transactions → Paramètres','Banques, connexion, compte, synchronisation, consentement et déconnexion existants','/dashboard/transactions?tab=parametres'],['Compte de résultat','Comptabilité → États financiers','Réel / prévisionnel, prévisions annuelles, configurations, détails','/dashboard/etats-financiers?tab=compte-resultat'],['Bilan','Comptabilité → États financiers','Tableau, configurations, équilibre et détails','/dashboard/etats-financiers?tab=bilan'],['Crédit','Comptabilité → États financiers','Activation, prêts, simulation, mensualités et imports','/dashboard/etats-financiers?tab=credit'],['Amortissements','Comptabilité → Amortissements','Configurations, calculs, tableaux et exports','/dashboard/amortissements'],['Tableau croisé dynamique','Comptabilité → Tableau croisé dynamique','Vues sauvegardées, filtres, détail et exports','/dashboard/pivot'],['Position fiscale','Comptabilité → Position fiscale globale','Ma position, Par appartement, Face à la liasse, Ce qui expire','/dashboard/position-fiscale']];
function preservation(){return title('Ce que l’on conserve, ce que l’on ajoute','Correspondance entre l’application actuelle et cette proposition de navigation.')+`<div class="comparison"><section class="panel"><h2>Conservé</h2><p>Transactions, banque, comptabilité et fiscalité. Les traitements métier et données restent la référence.</p>${badge('Navigation réorganisée','green')}</section><section class="panel"><h2>Ajouté</h2><p>Fiches de biens, locataires, contrats, loyers, candidatures et interventions. Les paiements se rattachent aux transactions existantes.</p>${badge('Gestion locative','')}</section></div><div class="toolbar"><strong>Choix à discuter : place de Transactions</strong></div><div class="comparison"><section class="panel"><h3>A · Entrée autonome — proposition affichée</h3><p>Visible au même niveau que Biens et Comptabilité ; accès direct depuis un paiement ou un bien.</p></section><section class="panel"><h3>B · Dans Comptabilité & fiscalité</h3><p>Conserver son regroupement actuel avec les outils financiers ; ajouter des raccourcis depuis la gestion.</p></section></div><h2 style="margin-top:28px">Inventaire de préservation</h2>`+table(['Aujourd’hui','Emplacement proposé','Fonctions conservées','Comparer'],preserved.map(r=>[r[0],r[1],r[2],live(r[3],'Écran actuel ↗')]),'preserve')+`<div class="note">Les liens vers l’application actuelle utilisent sa sélection de bien existante. La maquette ne modifie ni cette sélection, ni les données, ni les calculs.</div>`;}
function render(){document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===model.page));document.getElementById('property-select').value=model.property;const global=model.page==='home'||model.page==='preservation'||model.page==='settings'||model.page==='fiscal'&&model.fiscalTab==='Position fiscale globale';document.getElementById('property-select').hidden=global;document.getElementById('scope-label').textContent=global?'Tous mes biens':'Bien actif';document.getElementById('scope-note').textContent=global?'Espace propriétaire':'Gestion et finance du même bien';document.getElementById('screen').innerHTML=({home,property,rents,candidates,transactions,fiscal,partners,settings,preservation}[model.page])();}
function assign(){modal('Attribuer un paiement',`<p>26 octobre · Virement Léa · <strong>450 € disponibles</strong></p><div class="form"><label>Locataire<select><option>Léa Martin · chambre 1</option><option>Alex Bernard · chambre 2</option></select></label><div class="fieldgrid"><label>Période<input value="Octobre 2026"></label><label>Montant affecté<input value="450,00 €"></label></div><p class="muted">Le mouvement bancaire reste unique. L’affectation permet de suivre le règlement du loyer.</p>${btn('Confirmer dans la maquette',"model.assigned=true;document.getElementById('detail').close();go('transactions');notice('Affectation simulée uniquement.')",true)}</div>`);}
function candidate(){modal('Camille D. · candidature de démonstration',`<p class="muted">Chambre 5 · La Carte des Colocs</p><div class="statusline">${badge('6 pièces reçues','green')}${badge(model.advance?'Informations validées':'Validation attendue','orange')}</div><h3>Informations initiales</h3><p>Professionnel · entrée souhaitée le 15 novembre · durée envisagée 12 mois · Visale</p><h3>Pièces reçues</h3><p>Garantie Visale, trois bulletins de paie, justificatif professionnel, avis d’imposition, attestation habitation actuelle, identité.</p><div class="checklist"><label><input type="checkbox" id="reviewed" onchange="document.getElementById('lease-next').disabled=!(this.checked&&document.getElementById('visited').checked)"> J’ai vérifié les informations et les pièces</label><label><input type="checkbox" id="visited" onchange="document.getElementById('lease-next').disabled=!(this.checked&&document.getElementById('reviewed').checked)"> Visite effectuée</label></div><p class="muted">La validation des pièces reste possible avant la visite. La création du bail exige la visite et la vérification des informations.</p><div class="card-actions">${btn('Valider les pièces',"validateCandidate()",true)}<button id="lease-next" disabled onclick="document.getElementById('detail').close();lease()">Préparer le bail</button></div>`);}
function validateCandidate(){if(!document.getElementById('reviewed').checked){notice('Cochez la vérification des informations avant de valider.');return}model.advance=true;document.getElementById('detail').close();go('candidates');notice('Validation simulée : le dossier avance uniquement sur votre décision.');}
function payment(name,month){modal('Paiements · '+name,`<p>${month} 2026 · ${P().name}</p>${table(['Dû','Affecté','Reste'],[[name==='Alex Bernard'&&month==='Oct'?'450 €':'450 €',name==='Alex Bernard'&&month==='Oct'?'300 €':'450 €',name==='Alex Bernard'&&month==='Oct'?'150 €':'0 €']])}<div class="card-actions">${btn('Voir les transactions',"document.getElementById('detail').close();go('transactions')")}${btn('Préparer une relance',"notice('Maquette : e-mail de relance à vérifier et envoyer manuellement.')")}</div>`);}
function tenant(){modal('Fiche locataire · exemple',`<div class="tabs"><span>Coordonnées · Dossier · Contrat · Garant · Solde</span></div><p>Léa Martin · lea@exemple.fr</p><p>Bail individuel · chambre 1 · contrat en cours</p><div class="card-actions">${btn('Contrat et garanties',"lease()")}${btn('Préparer une sortie',"departure()")}</div>`);}
function departure(){modal('Préparer la sortie',`<div class="form"><label>Préavis reçu le<input type="date"></label><label>Date de départ validée<input type="date"></label></div><div class="checklist">${['Préavis vérifié par le propriétaire','État des lieux de sortie effectué','Rapport déposé','Dépôt de garantie régularisé et restitution suivie'].map(x=>`<label><input type="checkbox">${x}</label>`).join('')}</div><p class="muted">Le contrat, les pièces et le solde restent consultables après clôture.</p>`);}
function lease(){modal('Bail & emménagement · exemple',`<div class="form"><div class="fieldgrid"><label>Loyer hors charges<input value="410 €"></label><label>Charges<input value="40 €"></label><label>Jour d’envoi de l’appel<input type="number" min="1" max="28" value="25"></label><label>Mode d’envoi<select><option>Automatique</option><option>Manuel</option></select></label></div></div><div class="card-actions">${btn('Aperçu du bail PDF',"notice('Modèle de bail à fournir : aucune génération contractuelle réelle dans la maquette.')")}</div><h3 style="margin-top:20px">Conditions d’entrée</h3><div class="checklist" id="move-checks">${['Bail signé','Assurance du nouveau logement reçue','Dépôt de garantie payé','Premier loyer payé','État des lieux d’entrée effectué'].map(x=>`<label><input type="checkbox" onchange="document.getElementById('activate').disabled=document.querySelectorAll('#move-checks input:checked').length!==5">${x}</label>`).join('')}</div><div class="card-actions"><button class="primary" id="activate" disabled onclick="notice('Passage en locataire actuel simulé — aucune donnée réelle modifiée.');document.getElementById('detail').close()">Valider l’entrée comme propriétaire</button></div>`);}
function newContact(){modal('Créer un contact manuellement',`<div class="form"><label>Nom et prénom<input value="Nouveau contact démo"></label><label>E-mail<input type="email" value="candidat@exemple.fr"></label><label>Bien / chambre<input value="${P().name} · chambre à préciser"></label>${btn('Créer dans la maquette',"model.created=true;document.getElementById('detail').close();go('candidates')",true)}</div>`);}
function openingBalance(){modal('Solde de départ',`<div class="form"><label>Locataire<select><option>Léa Martin</option><option>Alex Bernard</option></select></label><label>Date de reprise<input type="date" value="2026-01-01"></label><label>Situation<select><option>À jour</option><option>Dette du locataire</option><option>Trop-perçu</option></select></label><label>Montant<input value="0,00 €"></label>${btn('Prévisualiser',"notice('Solde de départ simulé : aucun historique à ressaisir.')")}</div>`);}
function editInfo(section){modal(section,`<p class="muted">Exemple de saisie manuelle. Les champs détaillés seront validés écran par écran.</p><div class="form"><label>Intitulé<input value="${P().name}"></label><label>Information<input placeholder="Renseigner l’information"></label>${btn('Enregistrer dans la maquette',"document.getElementById('detail').close();notice('Démonstration uniquement, aucune donnée sauvegardée.')",true)}</div>`);}
function newProperty(){modal('Ajouter un bien',`<div class="form"><label>Intitulé<input placeholder="Nom du bien"></label><label>Mode de location<select><option>Logement entier</option><option>Colocation · bail commun</option><option>Chambres · baux individuels</option><option>Courte durée</option></select></label><label>Nombre de chambres<input type="number" min="1" value="5"></label>${btn('Prévisualiser la fiche',"document.getElementById('detail').close();go('property')",true)}</div>`);}
render();
</script>
